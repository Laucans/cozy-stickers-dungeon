  const crew = home.creatures.filter(x => diceOf(x) > 0 && !isOut(x)), sel = new Set();
  const draw = () => {
    if (!m.isConnected) return;
    const team = crew.filter(x => sel.has(x.id)), malus = Math.floor(c.def / 6);
    let pool = team.reduce((a, x) => a + diceOf(x), 0) + ((home.ach || {}).escarmouche ? 1 : 0) + (home.theme === 'repaire' ? 1 : 0) - malus;
    m.querySelector('.mbody').innerHTML = `<h2>🏹 Escarmouche chez ${esc(c.master)}</h2>
      <p>Une petite expédition taquine : tes créatures tentent de chaparder un peu d’or au ${esc(c.name)}. Leurs défenses comptent (force ${c.def} : −${malus} dé${malus > 1 ? 's' : ''}). Réussie, elle te rapporte de l’or et de la notoriété ; ratée, tes troupes rentrent vexées. Le château visé gagne un bouclier de 12 h.</p>
      <h3>Équipe (${sel.size}/3)</h3><div class="choices">${crew.map(x => `<button type="button" class="choice" data-mate="${x.id}" aria-pressed="${sel.has(x.id)}" ${!sel.has(x.id) && sel.size >= 3 ? 'disabled' : ''}>${imgThumb('char', x.sp)}<b>${esc(x.name)}</b><span>${SPECIES[x.sp].name} · ${diceOf(x)} 🎲</span>${hearts(x.mood)}</button>`).join('') || '<p class="hint">Personne ne peut partir.</p>'}</div>
      ${sel.size ? `<p class="odds">${oddsText(pool)}</p>` : ''}
      <div class="mfoot"><button class="sbtn" type="button" data-close>Plus tard</button><button class="sbtn pri" type="button" id="skGo" ${sel.size ? '' : 'disabled'}>🏹 Lancer l’escarmouche</button></div>`;
    m.dataset.pool = pool;
  };
  draw();
  m.addEventListener('click', async e => {
    const mt = e.target.closest('[data-mate]');
    if (mt && !mt.disabled) { sel.has(mt.dataset.mate) ? sel.delete(mt.dataset.mate) : sel.add(mt.dataset.mate); sfx('tick'); draw(); return; }
    if (!e.target.closest('#skGo')) return;
    const roll = rollPool(+m.dataset.pool), team = crew.filter(x => sel.has(x.id));
    const base = 4 + 2 * c.tier, loot = roll.res === 'crit' ? Math.ceil(base * 1.5) : roll.res === 'full' ? base : roll.res === 'partial' ? Math.ceil(base / 2) : 0;
    const lines = [];
    if (roll.res === 'fail') { team.forEach(x => { x.mood = clamp(x.mood - 1, 0, 5); }); home.menace += 1; lines.push('💨 Repoussés ! Tes troupes rentrent vexées (−1 ❤️) et le village jase (+1 Menace).'); }
    else { home.gold += loot; home.hype += roll.res === 'partial' ? 1 : 2; home.stats.skirmishWon++; team.forEach(x => { addLoy(x, 3); x.raidsWon = (x.raidsWon || 0) + 1; });
      lines.push(`🎒 Butin : +${loot} 💰, +${roll.res === 'partial' ? 1 : 2} 🔥.`); if (roll.res === 'partial') { const x = pick(team); x.mood = clamp(x.mood - 1, 0, 5); lines.push(`🤕 ${x.name} s’est pris un balai sur la tête (−1 ❤️).`); } }
    home.val.skirmish = home.night;
    valSend('raid', pk, { res: roll.res, loot }).catch(() => {});

// retire ce château du Val : remplace la fiche publique et demande aux relais d’effacer les anciennes

/* =========================================================
   Le château partagé : plusieurs Maîtres dans le même château,
   en temps réel. L’hôte fait foi : les invités lui envoient leurs
   actions, il les vérifie et renvoie l’état du château à tous.
   Les messages sont chiffrés avec le code du salon.
   ========================================================= */
const COOP = { role: null, code: '', tag: '', key: null, sub: null, me: null, peers: new Map(), host: null, own: null, busy: false, rev: 0, snapTimer: 0,
  curT: 0, curKey: '', ready: false, armed: 0, timers: [], hostAt: 0, tokens: 6, tokT: 0 };
const COOP_COLORS = ['#ff9c3a', '#5ad1ff', '#c49bff', '#7fe07f', '#ff7aa8', '#ffd95a'];
const COOP_KIND = 25078, COOP_MAX = 5;
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), x => CODE_ABC[x % CODE_ABC.length]).join('');
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
const coopLink = () => SITE_URL.replace(/\/$/, '/') + '?coop=' + COOP.code;
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; };
const plain = h => { try { return new DOMParser().parseFromString(String(h), 'text/html').body.textContent || ''; } catch (e) { return ''; } };

function coopBoot() {
  cv.addEventListener('pointermove', coopCursor);
  $('#coopbar').addEventListener('click', coopBarClick);
  $('#coopbar').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'coopMsg') coopChat(); });
  let code = ''; try { code = normCode(new URLSearchParams(location.search).get('coop')); } catch (e) {}
  if (code.length === 6) setTimeout(() => { if (NET.name) coopJoin(code); else askMasterName(() => coopJoin(code)); }, 700);

/* ---------- transport ---------- */
async function coopSend(msg) {
  if (!COOP.role || !COOP.key) return;
  const now = performance.now(); COOP.tokens = Math.min(6, COOP.tokens + (now - COOP.tokT) / 220); COOP.tokT = now;
  if (msg.t === 'cur' && COOP.tokens < 2) return;
  COOP.tokens = Math.max(0, COOP.tokens - 1);
  try {
    const ev = sign(COOP_KIND, [['t', COOP.tag]], await seal(COOP.key, { ...msg, from: COOP.me.id }));
    NET_LIVE.forEach(u => relaySend(relay(u), ['EVENT', ev]));
  } catch (e) { console.error(e); }
}
async function coopOpen(code) {
  COOP.code = code; const k = await roomKeys(code); COOP.tag = k.tag; COOP.key = k.key;
  COOP.sub = netSub(NET_LIVE, () => [{ kinds: [COOP_KIND], '#t': [COOP.tag], since: nowS() - 10 }], coopRecv, null, 4000);
  COOP.timers.push(setInterval(coopTick, 4000));
}
async function coopRecv(ev) {
  if (!COOP.key) return;
  let m; try { m = await unseal(COOP.key, ev.content); } catch (e) { return; }
  if (!m || typeof m !== 'object' || !m.from || m.from === COOP.me.id) return;
  const p = COOP.peers.get(m.from); if (p) p.at = Date.now();
  if (COOP.role === 'host') coopHostMsg(m, ev.pubkey); else coopGuestMsg(m);
}
function coopTick() {
  const now = Date.now();
  coopSend({ t: 'ping', name: COOP.me.name, color: COOP.me.color, ready: COOP.ready });
  if (COOP.role === 'host') {
    let gone = false; COOP.peers.forEach((p, id) => { if (now - p.at > 30000) { COOP.peers.delete(id); gone = true; toast(`👋 ${p.name} a quitté ton château.`); } });
    if (gone) { coopSend({ t: 'peers', list: coopPeerList() }); renderCoopBar(); }
  } else if (COOP.role === 'guest' && now - COOP.hostAt > 35000) { toast(`Le château de ${COOP.host ? COOP.host.name : 'l’hôte'} ne répond plus. Retour chez toi.`, true); coopLeave(); }
}
const coopPeerList = () => [{ id: COOP.me.id, name: COOP.me.name, color: COOP.me.color, host: true }, ...[...COOP.peers.values()].map(p => ({ id: p.id, name: p.name, color: p.color, ready: p.ready }))];

/* ---------- hôte ---------- */
async function coopHost() {
  if (!NET.ok || COOP.role || VISIT || !S.started) return;
  COOP.role = 'host'; COOP.me = { id: rid(4), name: NET.name || 'Maître', color: COOP_COLORS[0] }; COOP.rev = 0;
  await coopOpen(newCode());
  renderCoopBar(); sfx('chime');
  toast(`🤝 Château partagé ouvert ! Code ${COOP.code}`);
  if (VAL.open) renderVal();
}
function coopHostMsg(m, pk) {
  const p = COOP.peers.get(m.from);
  if (m.t === 'hello') {
    if (!p && COOP.peers.size >= COOP_MAX) { coopSend({ t: 'full', to: m.from }); return; }
    const used = new Set([COOP.me.color, ...[...COOP.peers.values()].map(x => x.color)]);
    const peer = p || { id: m.from, pk, name: cleanName(m.name, 24) || 'Maître', color: COOP_COLORS.find(c => !used.has(c)) || COOP_COLORS[1], at: Date.now(), ready: false };
    if (!p) { COOP.peers.set(m.from, peer); toast(`🤝 ${peer.name} entre dans ton château !`); sfx('chime'); }
    coopSend({ t: 'welcome', to: m.from, s: S, rev: ++COOP.rev, host: { id: COOP.me.id, name: COOP.me.name, color: COOP.me.color }, color: peer.color, busy: UI.busy });
    coopSend({ t: 'peers', list: coopPeerList() }); renderCoopBar();
    return;
  }
  if (!p) return;
  if (m.t === 'cmd') {
    if (UI.busy) { coopSend({ t: 'nack', to: m.from, err: 'La nuit est en cours, patience !' }); return; }
    const f = CMD[m.c]; if (!f || m.c === 'rename') return;
    let err = null; try { err = f(m.a || {}); } catch (e) { err = 'Action impossible'; }
    if (err) { coopSend({ t: 'nack', to: m.from, err }); coopDirty(); return; }
    afterChange(); coopDirty();
  } else if (m.t === 'cur') { Object.assign(p, { x: +m.x, y: +m.y, z: +m.z || 0, hand: Array.isArray(m.h) ? m.h : null, curAt: Date.now() }); }
  else if (m.t === 'ready') { p.ready = !!m.on; renderCoopBar(); coopSend({ t: 'peers', list: coopPeerList() }); if (m.on && [...COOP.peers.values()].every(x => x.ready)) toast('🌙 Tout le monde est prêt : lance la nuit quand tu veux !'); }
  else if (m.t === 'ping') { p.name = cleanName(m.name, 24) || p.name; p.ready = !!m.ready; }
  else if (m.t === 'chat') coopShowChat(p, m.text);
  else if (m.t === 'bye') { COOP.peers.delete(m.from); toast(`👋 ${p.name} a quitté ton château.`); coopSend({ t: 'peers', list: coopPeerList() }); renderCoopBar(); }
}
function coopDirty() { if (COOP.role !== 'host') return; clearTimeout(COOP.snapTimer); COOP.snapTimer = setTimeout(() => coopSend({ t: 'snap', s: S, rev: ++COOP.rev }), 250); }
function coopNightGate() {
  if (COOP.role === 'guest') {
    COOP.ready = !COOP.ready; coopSend({ t: 'ready', on: COOP.ready }); renderCoopBar(); sfx('tick');
    toast(COOP.ready ? '✋ Tu es prêt·e. L’hôte lancera la nuit.' : 'Tu n’es plus prêt·e.'); return false;
  }
  if (COOP.role === 'host') {
    const wait = [...COOP.peers.values()].filter(p => !p.ready);
    if (wait.length && Date.now() - COOP.armed > 5000) { COOP.armed = Date.now(); toast(`${wait.map(p => p.name).join(', ')} : pas encore prêt·e${wait.length > 1 ? 's' : ''}. Clique encore pour lancer la nuit quand même.`); return false; }
    COOP.armed = 0; clearTimeout(COOP.snapTimer); coopSend({ t: 'snap', s: S, rev: ++COOP.rev }); coopSend({ t: 'busy', on: true });
  }
  return true;
}
function coopNightDone() {
  if (COOP.role !== 'host') return;
  COOP.peers.forEach(p => { p.ready = false; });
  coopSend({ t: 'busy', on: false }); coopSend({ t: 'snap', s: S, rev: ++COOP.rev }); coopSend({ t: 'peers', list: coopPeerList() }); renderCoopBar();
}
function coopCast(t, o) { if (COOP.role === 'host') coopSend({ t, ...o }); }

/* ---------- invité ---------- */
async function coopJoin(code) {
  code = normCode(code);
  if (!NET.ok || code.length !== 6) { toast('Code de château invalide.', true); return; }
  if (COOP.role) { if (COOP.code === code) return; coopLeave(true); }
  if (VISIT) leaveVisit(true);
  if (UI.busy) { toast('Termine d’abord ta nuit en cours.', true); return; }
  save();
  COOP.role = 'joining'; COOP.me = { id: rid(4), name: NET.name || 'Maître', color: '#ffffff' }; COOP.rev = -1; COOP.hostAt = Date.now();
  await coopOpen(code);
  closeModal(true); renderCoopBar(); toast(`🤝 On frappe à la porte du château ${code}…`);
  let n = 0; const hello = () => { if (COOP.role !== 'joining') return; if (n++ >= 10) { toast('Aucun château ne répond à ce code. Vérifie-le, ou demande à ton ami de rouvrir son château.', true); coopLeave(true); return; } coopSend({ t: 'hello', name: COOP.me.name }); COOP.helloT = setTimeout(hello, 2500); };
  hello();
}
function coopGuestMsg(m) {
  if (m.t === 'welcome' || m.t === 'snap' || m.t === 'busy' || m.t === 'banner' || m.t === 'phase' || m.t === 'chron' || m.t === 'peers' || m.t === 'end' || (m.t === 'ping' && COOP.host && m.from === COOP.host.id)) COOP.hostAt = Date.now();
  if (m.t === 'full' && m.to === COOP.me.id && COOP.role === 'joining') { toast('Ce château est complet (5 Maîtres maximum).', true); coopLeave(true); return; }
  if (m.t === 'welcome' && m.to === COOP.me.id) {
    if (COOP.role !== 'joining') return;
    clearTimeout(COOP.helloT); COOP.role = 'guest'; COOP.host = m.host; COOP.me.color = m.color || '#5ad1ff';
    COOP.own = S; Z = 0; resetActors(); dropSticker(); closeModal(true); advisorHide();
    coopApply(m, true); CAM.user = false; fitCamera(); setGuestBusy(!!m.busy);
    document.body.classList.add('coop-guest'); renderCoopBar(); sfx('chime');
    banner(`🤝 ${esc(S.name)}`, `Château de ${esc(m.host.name)}`, 1800);
    return;
  }
  if (COOP.role !== 'guest') return;
  if (m.t === 'snap') coopApply(m);
  else if (m.t === 'nack' && m.to === COOP.me.id) { toast(cleanName(m.err, 120) || 'Action refusée', true); sfx('bad'); }
  else if (m.t === 'busy') setGuestBusy(!!m.on);
  else if (m.t === 'banner') banner(esc(plain(m.text)), esc(plain(m.sub)), clamp(+m.ms || 1200, 300, 4000));
  else if (m.t === 'phase' && PHASES.some(p => p[0] === m.k)) setPhase(m.k);
  else if (m.t === 'chron' && Array.isArray(m.report)) {
    if (COOP.own && COOP.own.stats) { COOP.own.stats.coopNights++; saveHome(); }

let MM_SIG = '';
function renderMinimap() {

  const sig = [w.seed, vis.size, fr, vr, W2, H2, S.world.known.length].join(':'); if (sig === MM_SIG) return; MM_SIG = sig;
  const dpr = Math.min(2, devicePixelRatio || 1); c.width = Math.round(W2 * dpr); c.height = Math.round(H2 * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#16121c'; g.fillRect(0, 0, W2, H2);

  w.list.forEach(cell => { const [x, y] = XY(cell); if (x < -s || x > W2 + s || y < -s || y > H2 + s) return; hexPath(g, x, y, s + .4); g.fillStyle = vis.has(cell.i) ? BIOMES[cell.t].col : '#2a2236'; g.fill(); });
  g.strokeStyle = 'rgba(217,183,122,.85)'; g.lineWidth = 1;
  w.roads.forEach(p => { for (let k = 1; k < p.length; k++) { if (!vis.has(p[k - 1]) || !vis.has(p[k])) continue; const [x1, y1] = XY(w.list[p[k - 1]]), [x2, y2] = XY(w.list[p[k]]); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); } });
  g.strokeStyle = 'rgba(255,214,120,.95)'; g.lineWidth = 1.5; g.beginPath();
  w.list.forEach(cell => { if (hdist(cell.q, cell.r) > fr) return; const [hx, hy] = hexXY(cell.q, cell.r, s); HEX_DIRS.forEach(([dq, dr]) => { if (hdist(cell.q + dq, cell.r + dr) <= fr) return; const [nx, ny] = hexXY(cell.q + dq, cell.r + dr, s), mx = (hx + nx) / 2, my = (hy + ny) / 2, dx = ny - hy, dy = -(nx - hx), L = Math.hypot(dx, dy), e = s / SQ3; g.moveTo(ox + mx + dx / L * e, oy + my + dy / L * e); g.lineTo(ox + mx - dx / L * e, oy + my - dy / L * e); }); });
  g.stroke();
  allSites().forEach(st => { if (!vis.has(st.i)) return; const [x, y] = XY(st); g.fillStyle = st.kind === 'chateau' ? '#ffd86a' : SITE_KINDS[st.kind].rank ? '#f3e3c0' : st.kind === 'rival' || st.kind === 'joueur' ? '#c49bff' : st.kind === 'raid' ? '#ff9a7a' : '#8fd4ff'; g.beginPath(); g.arc(x, y, st.kind === 'chateau' ? 3.4 : 2.3, 0, 7); g.fill(); g.lineWidth = 1; g.strokeStyle = 'rgba(20,12,8,.8)'; g.stroke(); });
}
addEventListener('resize', () => requestAnimationFrame(() => { MM_SIG = ''; renderMinimap(); }));

  return Math.ceil(SHOP[item].price * m);
}
const shopLeft = item => { const st = (S.world.shop || {})[item], per = SHOP[item].per; return !per || st == null || S.night >= st + per ? 0 : st + per - S.night; };
const recruitable = () => SPECIES_ORDER.filter(sp => S.album[sp] && !SPECIES[sp].rare && !(SPECIES[sp].tier > S.tier));
function shopBuy(a) {
  const site = siteById(a.site); if (!site || !SITE_KINDS[site.kind].shop || !siteKnown(site)) return 'Tu ne connais pas le chemin';
  const item = a.item, arg = a.arg, shops = SHOPS[site.kind] || [];
  if (!SHOP[item] || !shops.some(s => s.items.includes(item))) return 'Ce n’est pas vendu ici';
  if (shopLeft(item)) return `Revenez dans ${shopLeft(item)} nuit(s)`;
  const stock = shopStock(site);
  if (item === 'deco' && !stock.deco.includes(arg)) return 'Plus en stock';
  if (item === 'artefact' && !stock.arts.includes(arg)) return 'Déjà vendu';
  if (item === 'rachat' && !stock.stolen.includes(arg)) return 'Introuvable';
  if (item === 'vendre' && !(FURN[arg] && FURN[arg].artefact && (S.free[arg] || 0) > 0)) return 'Il faut l’avoir en réserve (pas exposé)';
  if (item === 'recrue') { if (!recruitable().includes(arg)) return 'Personne de cette espèce ne cherche du travail'; if (beds() <= S.creatures.length) return 'Il faut un lit libre'; }
  const price = item === 'tableau' ? 0 : shopPrice(site, item, arg); if (price > 0 && S.gold < price) return `Il te faut ${price} 💰`;
  const w = world();
  if (item === 'humeur') homeCreatures().forEach(c => { c.mood = clamp(c.mood + 1, 0, 5); });
  else if (item === 'fidelite') S.creatures.forEach(c => addLoy(c, 12));
  else if (item === 'tisane') S.calamity = Math.max(0, S.calamity - 3);
  else if (item === 'oubli') S.menace = Math.max(0, S.menace - 2);
  else if (item === 'dossier') S.menace = Math.max(0, S.menace - 3);
  else if (item === 'tournee') S.hype += 2;
  else if (item === 'merco') S.world.merc = S.night + 3;
  else if (item === 'avis') S.world.decoy = true;
  else if (item === 'rumeur' || item === 'tresor') {
    const vis = visibleSet(); let want = w.sites.filter(s => !vis.has(s.i) && (item === 'tresor' ? s.expe : s.kind !== 'chateau')).sort((x, y) => hdist(x.q, x.r, site.q, site.r) - hdist(y.q, y.r, site.q, site.r));
    if (item === 'rumeur') { const town = want.find(x => SITE_KINDS[x.kind].town); if (town && !w.sites.some(x => SITE_KINDS[x.kind].town && vis.has(x.i))) want = [town]; }
    const s = want[0];
    if (!s) return 'Tu connais déjà tous les endroits dont on parle ici';
    discover([...discAround(s.q, s.r, 1), ...(w.roads.get(s.id) || [])], item === 'rumeur' ? 'rumeurs de taverne' : 'carte au trésor'); a.found = s.name;
  }
  else if (item === 'carte') discover([...discAround(site.q, site.r, 2), ...(w.roads.get(site.id) || [])], 'carte du cartographe');
  else if (item === 'deco') S.free[arg] = (S.free[arg] || 0) + 1;
  else if (item === 'artefact') giveArtefact(arg, 'acheté en ville');
  else if (item === 'rachat') { S.world.stolen = S.world.stolen.filter(k => k !== arg); giveArtefact(arg, 'racheté au brocanteur'); }
  else if (item === 'vendre') { S.free[arg]--; addLog(`${FURN[arg].name} vendu au brocanteur.`); }
  else if (item === 'recrue') { const c = addCreature(arg); c.isNew = true; c.loy = 45; addLog(`${c.name} (${SPECIES[arg].name}) recruté·e au bureau de placement.`, 'good'); }
  if (price) S.gold -= price;
  if (SHOP[item].per) (S.world.shop = S.world.shop || {})[item] = S.night;
  return null;
}
CMD.shop = shopBuy;
function openTown(siteId) {
  const site = siteById(siteId); if (!site || !SITE_KINDS[site.kind].shop) return;
  if (!siteKnown(site)) { toast('Tu ne connais pas encore le chemin.', true); return; }
  if (UI.busy) return;
  const mk2 = townMarkup(site), stock = shopStock(site), shops = SHOPS[site.kind], pp = partyPreview();
  const priceTag = (item, arg) => { const p = shopPrice(site, item, arg); return p < 0 ? `+${-p} 💰` : p ? `${p} 💰` : 'gratuit'; };
  const btn = (item, arg, label) => { const left = shopLeft(item), p = item === 'tableau' ? 0 : shopPrice(site, item, arg), poor = p > 0 && S.gold < p;
    return `<button class="sbtn ${item === 'tableau' ? '' : 'pri'}" type="button" data-buy="${item}" ${arg ? `data-arg="${arg}"` : ''} ${left || poor ? 'disabled' : ''}>${label || 'Acheter'} · ${priceTag(item, arg)}${left ? ` (dans ${left} nuit${left > 1 ? 's' : ''})` : ''}</button>`; };
  const row = (item, inner) => `<div class="srow"><span class="emo">${SHOP[item].ico}</span><span class="sdesc"><b>${esc(SHOP[item].name)}</b><br><span class="hint">${esc(SHOP[item].desc || '')}</span></span>${inner}</div>`;
  const itemHTML = item => {
    if (item === 'deco') return stock.deco.map(k => `<div class="srow">${imgThumb('furn', k)}<span class="sdesc"><b>${esc(FURN[k].name)}</b><br><span class="hint">Sticker de déco · ${statTags(FURN[k])}</span></span>${btn('deco', k)}</div>`).join('');
    if (item === 'artefact') return stock.arts.length ? stock.arts.map(k => `<div class="srow art">${imgThumb('furn', k)}<span class="sdesc"><b>${esc(FURN[k].name)}</b> <span class="tag2 gold">✨ ${FURN[k].glow}</span><br><span class="hint">${esc(FURN[k].desc)}</span></span>${btn('artefact', k)}</div>`).join('') : '<p class="hint">Pas d’artefact cette nuit : « Revenez demain, j’attends un arrivage. »</p>';
    if (item === 'rachat') return stock.stolen.map(k => `<div class="srow art">${imgThumb('furn', k)}<span class="sdesc"><b>${esc(FURN[k].name)}</b><br><span class="hint">« Trouvé sur un aventurier, ça vous dit quelque chose ? »</span></span>${btn('rachat', k, 'Racheter')}</div>`).join('');
    if (item === 'vendre') { const mine = ARTEFACTS.filter(k => (S.free[k] || 0) > 0); return mine.length ? mine.map(k => `<div class="srow">${imgThumb('furn', k)}<span class="sdesc"><b>Vendre : ${esc(FURN[k].name)}</b><br><span class="hint">Un artefact en réserve ne fait pas rayonner le château.</span></span>${btn('vendre', k, 'Vendre')}</div>`).join('') : ''; }
    if (item === 'recrue') { const sp = recruitable(); return row('recrue', '') + (sp.length ? `<div class="srecr">${sp.map(k => `<div class="srow">${imgThumb('char', k)}<span class="sdesc"><b>${esc(SPECIES[k].name)}</b><br><span class="hint">${esc(SPECIES[k].skill)}</span></span>${btn('recrue', k, 'Embaucher')}</div>`).join('')}</div>` : '<p class="hint">Ton album est vide : personne à recruter.</p>'); }
    if (item === 'tableau') return row('tableau', `<span class="sinfo">${pp.origin ? `<b>${pp.size} ${esc(HERO_RANK[pp.rank].label.toLowerCase())}</b> de ${esc(pp.origin.name)}, courage ~${pp.courage}${S.world.decoy ? ' (moins 25 % grâce à ton faux avis)' : ''}. Menace ${S.menace}/${MENACE_MAX}.` : 'Personne pour l’instant.'}</span>`);
    return row(item, btn(item));
  };
  const m = openModal(`<div class="town ${site.kind}"><h2>${site.kind === 'village' ? '🏪' : site.kind === 'ville' ? '🏙️' : '🏰'} ${esc(site.name)}</h2>
    <p class="hint">${esc(pick(TOWN_INTRO[site.kind]))}${mk2.spotted ? ' <b>Malheureusement, ton château rayonne tellement qu’on te reconnaît malgré la moustache : les prix grimpent de 20 %.</b>' : ''} Tu as ${S.gold} 💰.</p>
    ${shops.map(sh => { const body = sh.items.map(itemHTML).join(''); return `<section class="shop"><h3>${esc(sh.title)}</h3><p class="keeper">${esc(pick(sh.keeper))}</p>${body}</section>`; }).join('')}
    <div class="mfoot"><button class="sbtn" type="button" data-close>↩ Repartir</button></div></div>`, { wide: true, cls: 'townm', label: site.name });
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-buy]'); if (!b || b.disabled) return;
    const item = b.dataset.buy, arg = b.dataset.arg;
    if (item === 'tableau') { sfx('tick'); toast(pp.origin ? `📋 Sur le tableau : « Château maléfique à visiter. Récompense honnête. » Départ prévu de ${pp.origin.name}.` : '📋 Rien au tableau pour ton château.'); return; }
    const a = { site: siteId, item, arg }, err = cmd('shop', a); if (err) { toast(err, true); sfx('bad'); return; }
    sfx('chime');
    toast(item === 'rumeur' ? `🍺 « Paraît qu’il y a ${a.found || 'quelque chose'} par là-bas… » (voir la carte)` : item === 'tresor' ? `❌ La carte mène à ${a.found || 'un endroit'} !` : item === 'vendre' ? '💰 Vendu ! « Un plaisir de faire affaire. »' : item === 'recrue' ? '🐾 Ta nouvelle recrue part pour le château.' : `✓ ${SHOP[item].name} : affaire conclue.`);
    afterChange(); if (MAPV.open) renderMapPanel(); openTown(siteId);
  });
}

  remparts: { cat: 'build', t: 'Agrandir le domaine', x: () => `<p>Le château pousse sur un terrain nu : tu colles tes pièces là où il n’y a rien. Depuis la fenêtre du <b>Palier</b>, tu peux élargir ce domaine : ${SIZE_COST.slice(1).map((c, i) => `${12 + 2 * (i + 1)}×${12 + 2 * (i + 1)} cases (Palier ${i + 1}, ${costText(c)})`).join(', puis ')}.</p><p>Une rangée s’ajoute de chaque côté et deux au fond, à tous les étages ; tout le château glisse d’autant, rien n’est perdu.</p>` },
  rayonnement: { cat: 'eco', t: 'Rayonnement', x: () => `<p>Le rayonnement (✨ en haut de l’écran) mesure l’éclat de ton château : ${GLOW_LV.map(([m, n]) => `${n} (${m})`).join(', ')}.</p>

    <li>En échange, les héros forts sèment plus d’or en fuyant, laissent plus souvent tomber un artefact, et leurs carnets de route dévoilent la carte.</li></ul>` },
  artefacts: { cat: 'eco', t: 'Artefacts', x: () => `<p>Des trésors uniques qui font rayonner le château et donnent un petit bonus. Ils ne s’achètent pas dans la barre : on les trouve.</p>
    <ul><li>Les héros repoussés en abandonnent parfois (surtout les forts).</li><li>Les {c:expeditions|expéditions} en rapportent.</li><li>Les bazars de la {c:ville} en vendent, à prix d’or.</li></ul>

    <ul>${ARTEFACTS.map(k => `<li><b>${esc(FURN[k].name)}</b> (✨ ${FURN[k].glow}) : ${esc(FURN[k].desc)}</li>`).join('')}</ul>` },
  rares: { cat: 'crea', t: 'Créatures rares', x: () => `<p>Quatre créatures ne viennent qu’à trois conditions : les avoir <b>rencontrées en expédition</b>, que ton château <b>rayonne</b> assez, et leur offrir <b>leur pièce</b>, meublée.</p>
    <ul>${SPECIES_ORDER.filter(k => SPECIES[k].rare).map(k => { const d = SPECIES[k]; return `<li>{sp:${k}} : rencontre à ${esc(SITE_KINDS[d.site] ? SITE_KINDS[d.site].label.toLowerCase() : d.site)}, rayonnement ${d.glow}, pièce {room:${d.from}}.</li>`; }).join('')}</ul><p>Chaque créature rare fait rayonner ton château de 10.</p>` },

});
