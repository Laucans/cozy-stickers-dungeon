<!doctype html><html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Stickers Dungeon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grenze+Gotisch:wght@600;800;900&family=Patrick+Hand&display=swap">
<style>
/* Mise en page : jeu plein écran — le château éclairé à la torche occupe tout le fond, l'interface flotte par-dessus en panneaux de cuir sombre cerclés de bronze (haut : ressources ; gauche : portraits ; bas : construction ; droite : envies et actions). Univers visuel unique et assumé. */
:root{
  --night:#0b0910; --leather:#1f1611; --leather-2:#2b1f17; --bronze:#8a6338; --bronze-2:#5a4028; --gold:#e9b949; --gold-2:#c99a4a;
  --cream:#f3e3c0; --cream-2:#cdb995; --ink:#2a1c16; --red:#c8413a; --red-2:#a0302b; --moss:#7fbf5a; --blue:#5a86d0;
  --parch:#f3e6c8; --parch-2:#e8d6b0; --parch-3:#d2ba8c; --ink-soft:#6e5444; --edge:#fffdf5;
  --f-display:"Grenze Gotisch",Georgia,serif; --f-body:"Andika","Segoe UI",system-ui,sans-serif; --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px)); --gt:max(10px, env(safe-area-inset-top, 0px)); --gb:max(10px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--night); color:var(--cream); font-family:var(--f-body); font-size:14px; line-height:1.35; overflow:hidden; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height:1}
.num{font-variant-numeric:tabular-nums}
#game{position:fixed; inset:0; overflow:hidden}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#cv.placing{cursor:crosshair}
.panel{background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:14px; box-shadow:inset 0 0 0 1px rgba(233,185,73,.28), 0 6px 18px rgba(0,0,0,.55)}
img.th{display:block; max-width:100%; max-height:100%; object-fit:contain}
img.th.mini{width:24px; height:24px; display:inline-block; vertical-align:middle}
img.ico{width:26px; height:26px; object-fit:contain; flex:none}
.hint{font-size:12.5px; color:var(--cream-2)}
.no{color:#ff8a7a}

/* ---------- haut ---------- */
.hud-top{position:absolute; top:var(--gt); left:var(--gl); right:var(--gr); display:flex; align-items:flex-start; gap:10px 14px; flex-wrap:wrap; pointer-events:none; z-index:5}
.hud-top > *{pointer-events:auto}
.brand{display:flex; flex-direction:column; line-height:.82; transform:rotate(-3deg); user-select:none; margin-right:2px}
.brand .small{font-family:var(--f-hand); font-size:17px; color:var(--cream); margin-left:3px}
.brand .big{font-family:var(--f-display); font-weight:900; font-size:38px; color:var(--red);
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),4px 0 0 var(--edge),-4px 0 0 var(--edge),0 4px 0 var(--edge),0 -4px 0 var(--edge),3px 3px 0 var(--edge),-3px -3px 0 var(--edge),3px -3px 0 var(--edge),-3px 3px 0 var(--edge),0 8px 10px rgba(0,0,0,.7)}
.castle{display:flex; flex-direction:column; padding:6px 12px; min-width:0}
.castle b{font-family:var(--f-display); font-size:19px; color:var(--gold); line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.castle small{color:var(--cream-2); font-size:12px}
.resbar{display:flex; flex-wrap:wrap; gap:2px 4px; padding:5px 8px; flex:1 1 420px; min-width:0}
.res{display:flex; align-items:center; gap:6px; padding:2px 8px 2px 4px; border-radius:10px}
.res b{display:block; font-family:var(--f-display); font-size:21px; line-height:1; color:var(--cream)}
.res small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); line-height:1}
.res.warn{background:rgba(200,65,58,.35)}
.res.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.dials{display:flex; gap:8px}
.dial{display:flex; align-items:center; gap:7px; padding:4px 11px 4px 4px; background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.55)}
.dial small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); font-weight:700}
.dial b{font-family:var(--f-display); font-size:18px; color:var(--cream)}
.sysbtns{display:flex; gap:6px; margin-left:auto}
.rbtn{width:42px; height:42px; border-radius:50%; border:2px solid var(--bronze); background:radial-gradient(circle at 40% 35%, #4a3626, #1e1410); font-size:18px; box-shadow:0 4px 12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(233,185,73,.3)}
.rbtn:hover{border-color:var(--gold)}
.phases{position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--gt) + 112px); display:flex; gap:4px; align-items:center; font-size:12px; font-weight:700; z-index:4; pointer-events:none; white-space:nowrap}
.phases span{padding:2px 9px; border-radius:999px; color:var(--cream-2); background:rgba(20,14,10,.6)}
.phases span.on{background:var(--gold); color:var(--ink)}
.phases i{color:var(--cream-2); font-style:normal; opacity:.6}

/* ---------- gauche : portraits ---------- */
.hud-left{position:absolute; left:var(--gl); top:140px; bottom:calc(var(--gb) + 200px); width:76px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:4}
.best{font-size:11.5px; padding:4px 8px; white-space:nowrap}
.portraits{display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden; padding:6px 6px 10px; scrollbar-width:none}
.portraits::-webkit-scrollbar{display:none}
.pt{position:relative; width:60px; height:60px; flex:none; border:0; padding:0; background:none; border-radius:50%}
.pt .ring{display:flex; align-items:flex-end; justify-content:center; width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 50% 30%, #6a5240, #1f1510 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 5px 12px rgba(0,0,0,.7)}
.pt img{width:96%; transform:translateY(16%)}
.pt:hover .ring, .pt.on .ring{box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 16px rgba(255,190,90,.7)}
.pt.away img{filter:grayscale(.9) brightness(.6)}
.pt .mood{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:38px; height:7px; border-radius:4px; border:1.5px solid #140c08; background:#3a2a20}
.pt .mood::after{content:""; position:absolute; inset:0; border-radius:3px; width:var(--w); background:var(--c)}
.pt .m0{--w:6%; --c:#d23a2a} .pt .m1{--w:20%; --c:#e0602f} .pt .m2{--w:40%; --c:#e0a53a} .pt .m3{--w:60%; --c:#d8c94a} .pt .m4{--w:80%; --c:#8ac24a} .pt .m5{--w:100%; --c:#5fd06a}
.pt .st{position:absolute; top:-4px; right:-4px; font-size:14px}

/* ---------- droite : envies, zoom ---------- */
.tracker{position:absolute; right:var(--gr); top:140px; width:270px; padding:8px 10px 10px; z-index:4}
.trackhead{display:flex; justify-content:space-between; width:100%; border:0; background:none; padding:0 0 4px; font-family:var(--f-display); font-size:18px; color:var(--gold); text-align:left}
.trackhead span{font-family:var(--f-body); font-size:12px; color:var(--cream-2)}
.tracker.closed .goals, .tracker.closed .link{display:none}
.goals{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.goals li{display:flex; gap:7px; font-size:13px; align-items:flex-start; padding:5px 7px; border-radius:9px; background:rgba(255,240,210,.05)}
.goals .ck{color:var(--gold)} .goals .rw{margin-left:auto; font-size:11.5px; color:var(--cream-2); text-align:right}
.link{border:0; background:none; color:var(--gold); font-size:12.5px; text-decoration:underline; padding:6px 0 0}
.zoom{position:absolute; right:var(--gr); top:300px; display:flex; flex-direction:column; gap:6px; z-index:4}
.zoom button{width:38px; height:38px; border-radius:10px; border:2px solid var(--bronze-2); background:rgba(26,18,14,.9); font-size:19px; font-weight:700; color:var(--cream)}
.zoom button:hover{border-color:var(--gold)}

/* ---------- bas : construction ---------- */
.hud-bottom{position:absolute; left:var(--gl); right:calc(var(--gr) + 330px); bottom:var(--gb); display:flex; flex-direction:column; gap:8px; z-index:5; pointer-events:none}
.hud-bottom > *{pointer-events:auto}
.handbar{display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:13.5px; align-self:flex-start; max-width:100%}
.handbar .msg{min-width:0}
.handbar .msg.bad{color:#ff9a8a; font-weight:700} .handbar .msg.ok{color:#b8f08a; font-weight:700}
.raidnote{align-self:flex-start; padding:5px 12px; font-family:var(--f-hand); font-size:16px}
.buildbar{display:flex; flex-direction:column; gap:6px; padding:8px; min-width:0}
.tabs{display:flex; gap:4px}
.tabs button{border:1.5px solid var(--bronze-2); background:rgba(0,0,0,.25); border-radius:999px; padding:3px 13px; font-weight:700; font-size:12.5px; color:var(--cream-2)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg, #f2c75a, #c99a3a); color:var(--ink); border-color:#f6d98a}
.sheet{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 6px; scroll-snap-type:x proximity; scrollbar-width:thin; scrollbar-color:var(--bronze) transparent}
.sheet .grp{flex:none; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--f-display); font-size:14px; color:var(--gold); padding:0 2px; text-align:center}
.card{position:relative; flex:none; width:96px; height:116px; display:flex; flex-direction:column; align-items:center; padding:6px 5px 5px; border-radius:12px; scroll-snap-align:start;
  border:2px solid var(--bronze-2); background:radial-gradient(circle at 50% 38%, #4e3a2a, #1e1510 72%); transition:transform .12s, box-shadow .12s, border-color .12s; user-select:none; -webkit-user-select:none}
.card:hover{transform:translateY(-3px); border-color:var(--gold-2)}
.card.sel{border-color:#ffc25a; box-shadow:0 0 0 2px #ff9c3a, 0 0 18px rgba(255,140,40,.75); transform:translateY(-4px)}
.card .pv{height:62px; width:100%; display:flex; align-items:center; justify-content:center}
.card .pv img{max-height:62px}
.card .nm{font-family:var(--f-display); font-size:14px; line-height:1; color:var(--cream); text-align:center; margin-top:3px; overflow-wrap:anywhere}
.card .cost{margin-top:auto; font-size:11px; font-weight:700; color:var(--gold)}
.card .cost.no{color:#ff8a7a}
.card.locked{filter:grayscale(.85) brightness(.7)}
.card .lock{position:absolute; top:4px; left:4px; right:4px; z-index:1; font-size:10px; font-weight:700; background:rgba(10,6,4,.85); color:var(--cream); border-radius:6px; padding:1px 4px; text-align:center}
.card .free{position:absolute; top:-7px; right:-7px; z-index:1; background:var(--moss); color:#122; border:2px solid #142010; border-radius:999px; font-size:11px; font-weight:800; padding:0 6px}
.tip{position:fixed; z-index:30; width:260px; padding:9px 11px; font-size:13px; pointer-events:none; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip b{display:block; font-family:var(--f-display); font-size:18px; color:var(--gold)} .tip p{margin:5px 0 0}

/* ---------- actions ---------- */
.hud-actions{position:absolute; right:var(--gr); bottom:var(--gb); display:flex; align-items:flex-end; gap:10px; z-index:5}
.round{display:flex; flex-direction:column; align-items:center; gap:3px; width:70px; border:0; background:none; padding:0}
.round img{width:62px; height:62px; padding:12px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #5a4430, #1e1410 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 6px 14px rgba(0,0,0,.7); transition:transform .12s}
.round span{font-family:var(--f-display); font-size:14px; color:var(--cream); text-shadow:0 2px 3px #000; white-space:nowrap}
.round:hover img{transform:translateY(-2px); box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 18px rgba(255,190,90,.6)}
.round[aria-pressed="true"] img, .round.on img{box-shadow:0 0 0 3px #ffc25a, 0 0 0 5px #2a1a0e, 0 0 20px rgba(255,150,50,.8)}
.round.night{width:96px}
.round.night img{width:88px; height:88px; padding:16px; background:radial-gradient(circle at 40% 35%, #c84a3a, #5a1410 78%); box-shadow:0 0 0 3px #f2c75a, 0 0 0 6px #2a1a0e, 0 8px 18px rgba(0,0,0,.7), 0 0 24px rgba(255,120,60,.35)}
.round.night span{font-size:16px; color:var(--gold)}
.round:disabled{opacity:.5; cursor:not-allowed}
.busy .card, .busy #btnRaid, .busy #btnTier{pointer-events:none; opacity:.55}
.pill{border:1.5px solid var(--bronze); border-radius:999px; padding:4px 11px; font-weight:700; font-size:12.5px; background:rgba(26,18,14,.92); color:var(--cream)}
.pill:hover{border-color:var(--gold)}

/* ---------- bannières, toasts ---------- */
.banner{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-2deg); z-index:20; background:var(--parch); color:var(--ink); border:3px solid var(--ink); font-family:var(--f-display); font-weight:900; font-size:clamp(24px,4vw,40px); line-height:1; padding:14px 26px; border-radius:14px; text-align:center; max-width:90%;
  box-shadow:0 0 0 5px var(--edge), 0 18px 40px rgba(0,0,0,.6); animation:pop .4s cubic-bezier(.2,1.5,.4,1); pointer-events:none}
.banner small{display:block; font-family:var(--f-hand); font-weight:400; font-size:18px; line-height:1.2; color:var(--ink-soft); margin-top:6px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4) rotate(-12deg)}}
.toasts{position:absolute; top:calc(var(--gt) + 64px); left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(470px, calc(100vw - 32px))}
.toast{padding:8px 14px; font-weight:700; font-size:14px; border-radius:12px; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); box-shadow:0 8px 20px rgba(0,0,0,.6); animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.toast.bad{border-color:var(--red)}
@keyframes tin{from{transform:translateY(-16px) scale(.92); opacity:0}}

/* ---------- fenêtres (parchemin) ---------- */
.backdrop{position:absolute; inset:0; z-index:50; background:rgba(8,5,4,.62); display:flex; align-items:center; justify-content:center; animation:fade .2s; padding:var(--gt) var(--gr) var(--gb) var(--gl)}
@keyframes fade{from{opacity:0}}
.modal{position:relative; width:100%; max-width:600px; max-height:calc(100% - 20px); overflow:auto; padding:20px; color:var(--ink); background:var(--parch); border:3px solid var(--ink); border-radius:18px;
  background-image:radial-gradient(circle at 15% 10%, rgba(255,255,255,.4), transparent 40%), radial-gradient(circle at 90% 95%, rgba(150,100,40,.16), transparent 45%);
  box-shadow:0 0 0 4px var(--gold-2), 0 0 0 7px #2a1a0e, 0 30px 70px rgba(0,0,0,.7); animation:mpop .35s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{max-width:800px}
@keyframes mpop{from{transform:scale(.88) rotate(-2deg); opacity:0}}
.modal h2{font-family:var(--f-display); font-weight:900; font-size:32px; line-height:1; margin:0 0 6px; color:var(--red-2); text-wrap:balance}
.modal h3{font-family:var(--f-display); font-weight:800; font-size:20px; margin:14px 0 6px; color:var(--ink)}
.modal p{margin:6px 0}
.modal .hint{color:var(--ink-soft)}
.modal .no{color:var(--red-2)}
.modal .x{position:absolute; top:12px; right:12px; border:2px solid var(--ink); background:var(--parch-2); border-radius:10px; width:34px; height:34px; font-size:15px; color:var(--ink)}
.mfoot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px}
.cardhead{display:flex; gap:14px; align-items:center; padding-right:30px}
.portrait{width:96px; height:96px; flex:none; border-radius:18px; background:radial-gradient(circle at 50% 40%, #5a4636, #1e1510); border:3px solid var(--gold-2); display:flex; align-items:center; justify-content:center; padding:6px; box-shadow:0 0 0 3px #2a1a0e, 0 6px 14px rgba(0,0,0,.4)}
.portrait.no img{filter:brightness(0) opacity(.35)}
.bubble{position:relative; background:var(--edge); border:2px solid var(--ink); border-radius:16px; padding:8px 13px; margin:14px 0 4px; font-family:var(--f-hand); font-size:18px; line-height:1.25}
.bubble::before{content:""; position:absolute; top:-12px; left:34px; border:10px solid transparent; border-top:0; border-bottom-color:var(--ink)}
.bubble::after{content:""; position:absolute; top:-8px; left:36px; border:8px solid transparent; border-top:0; border-bottom-color:var(--edge)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin-top:8px}
.kv dt{font-weight:700; color:var(--ink-soft)} .kv dd{margin:0}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
.sbtn{border:2px solid var(--ink); border-radius:11px; padding:7px 12px; font-weight:700; font-size:13.5px; background:var(--parch-2); color:var(--ink); box-shadow:0 2px 0 var(--ink); display:inline-flex; align-items:center; gap:5px}
.sbtn:hover{background:var(--parch-3)}
.sbtn.pri{background:var(--gold)} .sbtn.pri:hover{background:#f2c066}
.sbtn.danger{background:#f0bfb2} .sbtn.danger:hover{background:#e8a593}
.sbtn:disabled{opacity:.45; cursor:not-allowed}
select.sel{font:inherit; font-size:13.5px; border-radius:10px; border:2px solid var(--ink); padding:6px 8px; background:var(--edge); color:var(--ink); max-width:100%}
.tag2{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--parch-2); border:1.5px solid var(--parch-3); color:var(--ink-soft); margin:2px 3px 0 0}
.tip .tag2{background:rgba(255,240,210,.08); border-color:var(--bronze-2); color:var(--cream-2)}
.hearts{font-size:11px; letter-spacing:-1px; white-space:nowrap} .hearts .off{opacity:.3}
.flist{display:flex; flex-direction:column; gap:6px}
.frow{display:flex; gap:10px; align-items:center; background:var(--edge); border:2px solid var(--parch-3); border-radius:12px; padding:5px 8px}
.frow img.th{width:46px; height:46px; flex:none}
.frow > span:nth-child(2){flex:1; min-width:0}
.clockrow{display:flex; gap:14px; align-items:center; margin:10px 0}
.clockrow svg{flex:none}
.choices{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px}
.choice{border:2px solid var(--ink); background:var(--edge); color:var(--ink); border-radius:14px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:3px; min-width:0; box-shadow:0 3px 0 var(--ink)}
.choice[aria-pressed="true"]{background:#fff0c0; box-shadow:0 0 0 3px var(--gold), 0 3px 0 var(--ink)}
.choice:disabled{opacity:.45; cursor:not-allowed}
.choice .emo{font-size:28px}
.choice img.th{width:42px; height:46px}
.choice b{font-family:var(--f-display); font-size:18px; line-height:1.05}
.choice span{font-size:12.5px; color:var(--ink-soft)}
.field{display:flex; flex-direction:column; gap:4px; margin:10px 0}
.field label{font-weight:700; font-size:13px}
.field input{font:inherit; border:2px solid var(--ink); border-radius:12px; padding:8px 12px; background:var(--edge); color:var(--ink)}
.team{display:flex; gap:6px; margin:6px 0} .team img.th{width:48px; height:52px}
.dice{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0}
.die{width:56px; height:56px; border-radius:14px; background:var(--edge); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:900; font-size:32px; color:var(--ink)}
.die.roll{animation:shake .12s infinite} .die.best{background:var(--gold)} .die.six{background:#a9d68f}

/* =========================================================
   Moteur : état, grille du château, portes, règles, économie, nuit

// ?profil=nom : une partie (et une identité de Maître) séparée sur le même navigateur

function newState(name, theme) {

  for (let y = HEART.y + HEART.h; y < GATE.y; y++) addRoom('couloir', GATE.x, y, 1, 1, true);
  addRoom('coeur', HEART.x, HEART.y, HEART.w, HEART.h, true);
  S.furn.push({ id: nid(), t: 'torche', x: HEART.x, y: HEART.y + 1 });
  addCreature('diablotin'); addCreature('diablotin');
  addLog('Le château s’éveille. Deux diablotins s’installent près du Cœur.', 'ev');

}
function addRoom(t, x, y, w, h, built) {

}
function addCreature(sp) {

}
function addLog(text, tone) { S.log.unshift({ n: S.night, text, tone: tone || '' }); if (S.log.length > 40) S.log.length = 40; }

/* ---------- grille & portes ---------- */
const dirty = () => { GRIDS = {}; DOORSZ = {}; syncGeom(); };
// la taille du château suit S.size (remparts agrandis) ; l'affichage est prévenu du décalage

const roomAt = (x, y, z = Z) => (y >= 0 && y < H && x >= 0 && x < W) ? grid(z)[y][x] : null;

const heartRoom = () => S.rooms.find(r => r.t === 'coeur');

// une porte entre un couloir et sa voisine ; une seule porte (au milieu) entre deux pièces

/* ---------- objets ---------- */
const furnAt = (x, y, z = Z) => S.furn.find(f => f.x === x && f.y === y && zOf(f) === z);

const inRoom = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;

const furnished = r => r.t === 'coeur' || furnIn(r).some(f => FURN[f.t].room !== 'any');
const builtRooms = () => S.rooms.filter(r => r.built);
const builtCount = t => S.rooms.filter(r => r.t === t && r.built).length;
const homeRooms = t => S.rooms.filter(r => r.t === t && r.built && furnished(r)).length;
// pièces meublées qui attirent une espèce (sa pièce d'origine, plus celles qui la listent dans « attracts »)
const nestsOf = sp => { const d = SPECIES[sp] || {}; return S.rooms.filter(r => r.built && furnished(r) && (r.t === d.from || (ROOMS[r.t].attracts || []).includes(sp))).length; };
// une créature rare ne vient que si on l'a rencontrée sur la carte et que le château rayonne assez
const rareOK = sp => { const d = SPECIES[sp] || {}; if (!d.rare) return true; return (!d.site || (typeof worldMet === 'function' && worldMet(sp))) && (typeof radiance !== 'function' || radiance() >= (d.glow || 0)); };
const mainRoomsBuilt = () => S.rooms.filter(r => r.built && !isHall(r) && r.t !== 'coeur').length;
const homeCreatures = () => S.creatures.filter(c => !c.raid);
const countSp = sp => S.creatures.filter(c => c.sp === sp).length;
const hasItem = t => S.furn.some(f => f.t === t);
const countItem = t => S.furn.filter(f => f.t === t).length;

function neighborsTypes(r) {
  const set = new Set();
  for (const [x, y] of cellsOf(r)) for (const [dx, dy] of DIRS) { const o = roomAt(x + dx, y + dy, zOf(r)); if (o && o !== r && o.built) set.add(o.t); }
  return set;
}
function rstat(r, key) {

const sumRooms = key => builtRooms().reduce((a, r) => a + rstat(r, key), 0);
// humeur : 0-1 boudeur (compétence éteinte), 2-3 normal, 4-5 ravi (compétence ×2)
const mult = c => c.mood >= 4 ? 2 + (c.lvl >= 5 ? 1 : 0) : c.mood >= 2 ? 1 + (c.lvl >= 5 ? 1 : 0) : 0;

const eaters = () => S.creatures.reduce((a, c) => a + (c.away ? 0 : (SPECIES[c.sp].eats || 1)), 0);

function castleTitle() { const a = ambiance(); let t = TITLES[0][1]; for (const [m, n] of TITLES) if (a >= m) t = n; return t; }
function hungrySet() {
  let left = foodCap(); const hungry = new Set();
  [...S.creatures].filter(c => !c.away).sort((a, b) => a.joined - b.joined).forEach(c => { const e = SPECIES[c.sp].eats || 1; if (left >= e) left -= e; else hungry.add(c.id); });

const trapBonus = () => Math.min(2, S.creatures.filter(c => SPECIES[c.sp].trap && !c.raid && c.mood >= 2).length);

/* ---------- coûts & disponibilité ---------- */
function costOf(kind, t) {

}
const canAfford = c => S.gold >= (c.g || 0) && S.mat >= (c.s || 0);
function pay(c) { S.gold -= c.g || 0; S.mat -= c.s || 0; }
function costText(c) { const p = []; if (c.g) p.push(c.g + ' 💰'); if (c.s) p.push(c.s + ' 🪵'); return p.length ? p.join(' ') : 'gratuit'; }

    if (d.deep && Z > -d.deep) return { lock: true, reason: d.deep > 1 ? 'Profondeurs' : 'Sous terre' };
    if (d.high && Z < d.high) return { lock: true, reason: d.high > 1 ? 'Les Cimes' : 'En hauteur' };
    if (Z < 0 && (d.open || d.edge)) return { lock: true, reason: 'À l’air libre' };
    if (Z > 0 && d.edge) return { lock: true, reason: 'Rez-de-chaussée' };

      const to = Z + d.stairs;
      if (d.stairs < 0 ? (Z > 0 || to < -DEPTH_MAX) : (Z < 0 || to > HEIGHT_MAX)) return { lock: true, reason: d.stairs < 0 ? (Z > 0 ? 'Pas en hauteur' : 'Trop profond') : (Z < 0 ? 'Pas sous terre' : 'Trop haut') };

    }
    if (d.tier && S.tier < d.tier) return { lock: true, reason: 'Palier ' + d.tier };

    const d = DEFS[t];
    if (Z !== 0) return { lock: true, reason: 'Rez-de-chaussée' };
    if (d.tier && S.tier < d.tier) return { lock: true, reason: 'Palier ' + d.tier };
    if (d.needs && !builtCount(d.needs)) return { lock: true, reason: ROOMS[d.needs].name };

    const f = FURN[t];
    if (f.hidden) return { hide: true };
    if (f.artefact && !(S.free[t] > 0)) return { lock: true, reason: hasItem(t) ? 'Exposé' : 'À trouver' };
    if (f.tier && S.tier < f.tier) return { lock: true, reason: 'Palier ' + f.tier };
    if (f.room !== 'any' && !S.rooms.some(r => r.t === f.room)) return { lock: true, reason: ROOMS[f.room].name };

/* ---------- placement ---------- */
function checkRoom(t, x, y, w, h) {
  const d = ROOMS[t];
  if (x < 0 || y < 0 || x + w > W || y + h > H) return 'Hors du domaine';
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) if (roomAt(x + dx, y + dy)) return 'Cet endroit est déjà occupé';
  const touching = [];
  for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) for (const [ax, ay] of DIRS) {
    const nx = x + dx + ax, ny = y + dy + ay;
    if (nx >= x && nx < x + w && ny >= y && ny < y + h) continue;
    if (roomAt(nx, ny)) touching.push([nx, ny]);
  }
  if (!touching.length) return 'Doit toucher une pièce ou un couloir du château';
  if (d.edge && Z === 0 && !(x === 0 || y === 0 || x + w === W || y + h === H)) return 'Doit toucher le bord du domaine';
  if (d.far && Z === 0) {
    const dist = gateDist(); let best = Infinity;
    touching.forEach(([nx, ny]) => { const v = dist.get(ny * W + nx); if (v !== undefined) best = Math.min(best, v + 1); });
    if (best < d.far) return `Trop près du porche : ${best === Infinity ? '?' : best} pas, il en faut ${d.far}`;
  }
  return null;
}
function checkFurn(t, x, y) {
  const r = roomAt(x, y), f = FURN[t];
  if (!r) return 'Un meuble se pose dans une pièce';
  if (r.t === 'porche') return 'Laisse le porche dégagé';
  if (furnAt(x, y)) return 'Il y a déjà quelque chose ici';
  if (f.room === 'any') { if (defAt(x, y)) return 'Un piège occupe déjà ce couloir'; return null; }
  if (r.t !== f.room) return `Ce meuble va dans : ${ROOMS[f.room].name}`;
  return null;
}
function checkDef(t, x, y) {
  const r = roomAt(x, y);
  if (!r || r.t !== 'couloir') return 'Les pièges se posent dans un couloir';
  if (defAt(x, y)) return 'Il y a déjà un piège ici';
  if (furnAt(x, y)) return 'Une déco occupe ce couloir';

}
function useCost(kind, t) { if ((S.free[t] || 0) > 0) S.free[t]--; else pay(costOf(kind, t)); }
function placeRoom(t, x, y, w, h) {
  pay(costOf('room', t));

  if (t === 'couloir') S.stats.dug++; else addLog(`Chantier lancé : ${d.name}.`);
  if (d.preset) d.preset.forEach((ft, i) => {
    const pos = i === 0 ? [r.x, r.y] : [r.x + r.w - 1, r.y + r.h - 1];
    const f = { id: nid(), t: ft, x: pos[0], y: pos[1], fixed: true }; if (Z) f.z = Z; S.furn.push(f);
  });

}

/* ---------- décoller ---------- */
function removeCheck(r) {
  if (ROOMS[r.t].fixed) return 'Cette pièce fait partie du château, elle ne se décolle pas.';
  if (r.land) return 'Ce palier tient à l’escalier de l’autre étage : c’est lui qu’il faut décoller.';
  if (ROOMS[r.t].stairs && r.pair) { const z2 = zOf(r) + ROOMS[r.t].stairs, n = S.rooms.filter(o => zOf(o) === z2 && o.id !== r.pair).length; if (n) return `Vide d’abord ${FLOOR_NAMES[z2]} (${n} pièce${n > 1 ? 's' : ''}).`; }

  const occ = new Map(); S.rooms.filter(o => o !== r && zOf(o) === z).forEach(o => cellsOf(o).forEach(([x, y]) => occ.set(y * W + x, o)));

function removeRoom(r) {

  S.gold += Math.floor((c.g || 0) * k); S.mat += Math.floor((c.s || 0) * k);

  if (l) { S.furn = S.furn.filter(f => !inRoomZ(l, f)); S.creatures.forEach(c => { if (c.post === l.id) c.post = null; }); S.rooms = S.rooms.filter(o => o !== l); }

/* ---------- paliers & envies ---------- */

  const next = TIERS[S.tier + 1]; if (!next) return null;
  const n = next.need, rows = [];
  rows.push({ ok: mainRoomsBuilt() >= n.rooms, text: `${n.rooms} pièces terminées (${mainRoomsBuilt()})` });
  rows.push({ ok: S.hype >= n.hype, text: `${n.hype} 🔥 de notoriété (${S.hype})` });
  if (n.species) rows.push({ ok: Object.keys(S.album).length >= n.species, text: `${n.species} espèces dans l’album (${Object.keys(S.album).length})` });
  if (n.trone) rows.push({ ok: S.rooms.some(r => r.t === 'trone' && r.built) && hasItem('trone'), text: 'Une Salle du trône terminée avec son Trône' });

function checkGoals() {
  const done = [];

    if (S.goals[g.id] || !g.test(S)) continue;
    S.goals[g.id] = true; const rw = g.reward;
    if (rw.g) S.gold += rw.g; if (rw.s) S.mat += rw.s;
    if (rw.free) S.free[rw.free] = (S.free[rw.free] || 0) + rw.n;

  const [gx, gy] = tileAtScreen(sx, sy);

async function runRaid(report) {
  const tg = RAIDS[S.raid.target], team = S.raid.team.map(id => S.creatures.find(c => c.id === id)).filter(Boolean);
  if (!team.length) { S.raid = null; return; }
  const b = raidBreakdown(S.raid.target, S.raid.team), n = b.pool <= 0 ? 2 : b.pool;
  const m = openModal(`<h2>${tg.emo} Raid : ${esc(tg.name)}</h2><div class="team">${team.map(c => imgThumb('char', c.sp)).join('')}</div>
    <p>${team.map(c => esc(c.name)).join(', ')} se faufilent dans la nuit…</p><p class="odds">${oddsText(b.pool)}</p>
    <div class="dice">${Array.from({ length: n }, () => '<div class="die">?</div>').join('')}</div><div id="rOut"></div>
    <div class="mfoot"><button class="sbtn pri" type="button" id="rRoll" data-focus>🎲 Lancer les dés</button></div>`, { noClose: true, label: 'Raid' });
  const btn = m.querySelector('#rRoll');
  await new Promise(res => btn.addEventListener('click', res, { once: true }));
  btn.disabled = true;
  const roll = rollPool(b.pool), dice = [...m.querySelectorAll('.die')];
  dice.forEach(d => d.classList.add('roll')); sfx('dice');
  for (let i = 0; i < 12; i++) { dice.forEach(d => d.textContent = 1 + rnd(6)); await sleep(70); }
  dice.forEach((d, i) => { d.classList.remove('roll'); d.textContent = roll.dice[i]; if (roll.dice[i] === 6) d.classList.add('six'); });
  const bi = roll.dice.indexOf(roll.best); if (dice[bi]) dice[bi].classList.add('best');
  const titles = { crit: '✨ Critique !', full: '🎉 Succès total !', partial: '😬 Succès… avec une complication', fail: '💨 Échec' };
  const lines = applyRaid(roll); sfx(roll.res === 'fail' ? 'bad' : 'chime');
  report.push([tg.emo, `${titles[roll.res]} (${roll.dice.join(', ')}) à ${tg.name}.`, roll.res === 'fail' ? 'bad' : 'good']); lines.forEach(l => report.push(l));
  addLog(`Raid ${tg.name} : ${titles[roll.res].replace(/^\S+ /, '')}`, roll.res === 'fail' ? 'bad' : 'good');
  m.querySelector('#rOut').innerHTML = `<p class="outcome">${titles[roll.res]}</p><ul class="chron">${lines.map(([e, t, tone]) => `<li class="${tone}"><span class="emo">${e}</span><span>${esc(t)}</span></li>`).join('')}</ul>`;

  await new Promise(res => btn.addEventListener('click', res, { once: true }));
  closeModal(true);
}

/* ---------- invasion animée ---------- */
async function runInvasion(report) {
  const plan = planInvasion(); sfx('horn');
  await banner('⚔️ Des aventuriers !', `${plan.party.map(h => esc(h.name)).join(' · ')}<br>Courage ${plan.courage}`, 2300);
  HEROS.length = 0; plan.party.forEach((h, i) => HEROS.push(newActor('hero' + i, 'hero', h.k, GATE.x + .5, H + 1.7)));
  let courage = plan.courage; V.courage = courage;
  const moveParty = (cx, cy, ms) => Promise.all(HEROS.map((a, i) => { a.walking = true; const o = (i - (HEROS.length - 1) / 2) * .18; return moveTo(a, cx + .5 + o, cy + .5 - o * .6 + (i % 2) * .1, ms); }));
  await moveParty(GATE.x, H, 800);
  let outcome = null, idx = 0; const path = plan.path;
  if (!path) outcome = 'lost';
  const hit = async (st, x, y) => {
    courage -= st.dmg; V.courage = Math.max(0, courage); sfx('bonk');
    floatText(x + .5, y + .5, `−${st.dmg} courage`, '#ffc4b4');
    if (st.defId) V.hit = { id: st.defId, t: performance.now() };
    if (st.dmg) say(pick(HEROS).id, pick(HERO_LINES.hit), 1700);
    report.push(['⚔️', `${st.label} : −${st.dmg} courage (reste ${Math.max(0, courage)}).`, st.dmg ? 'good' : '']);
    await sleep(850);
    if (st.lost && Math.random() < st.lost) { floatText(x + .5, y + .2, 'Perdus !'); say(HEROS[0].id, 'On est où, là ?', 1600); await sleep(600); return 'lost'; }
    return courage <= 0 ? 'repelled' : null;
  };
  if (path) for (idx = 0; idx < path.length; idx++) {
    const [x, y] = path[idx]; await moveParty(x, y, idx ? 440 : 520);
    for (const st of plan.steps.filter(s => s.i === idx)) { outcome = await hit(st, x, y); if (outcome) break; }
    if (outcome) break;
  }
  if (!outcome) outcome = 'robbed';
  if (outcome === 'robbed') { say(HEROS[0].id, pick(HERO_LINES.win), 1900); floatText(HEROS[0].x, HEROS[0].y, 'Pillage !', '#ffe07a'); sfx('bad'); await sleep(950); }
  else { say(HEROS[0].id, pick(HERO_LINES.flee), 1900); await sleep(550); }
  if (path) for (const [x, y] of path.slice(0, Math.min(idx, path.length - 1) + 1).reverse()) await moveParty(x, y, 190);
  await moveParty(GATE.x, H + 1, 520); HEROS.forEach(a => a.alpha = 0); await sleep(250);
  HEROS.length = 0; V.courage = null;
  const lines = applyInvasion(plan, outcome); lines.forEach(l => report.push(l));
  addLog(outcome === 'robbed' ? 'Des héros ont pillé le Cœur.' : 'Invasion repoussée !', outcome === 'robbed' ? 'bad' : 'good');
  if (outcome !== 'robbed') sfx('chime');
  renderAll();
  await banner(outcome === 'robbed' ? '💔 Le Cœur est pillé' : '🎉 Invasion repoussée !', lines[0] ? esc(lines[0][1]) : '', 2100);
}

/* ---------- nuit ---------- */
async function endNight() {
  if (UI.busy) return;
  if (typeof coopNightGate === 'function' && !coopNightGate()) return;
  dropSticker(); closeModal(true); setFloor(0);
  UI.busy = true; document.body.classList.add('busy'); $('#btnNight').disabled = true;
  const n = S.night, report = [];
  try {
    setPhase('calamite');
    const cd = calamityDelta(), before = S.calamity; S.calamity = Math.max(0, S.calamity + cd.d);
    report.push(['sec', 'Calamité'], ['🌀', `Horloge de Calamité : ${before} → ${Math.min(S.calamity, CAL_MAX)}${cd.parts.length ? ' (' + cd.parts.join(', ') + ')' : ''}.`, cd.d > 0 ? 'bad' : 'good']);
    renderHUD(); await banner('Calamité', cd.d > 0 ? `L’horloge avance de ${cd.d}` : 'Tout est calme', 1100);
    if (S.calamity >= CAL_MAX) { const ev = pick(CALAMITIES.filter(c => c.when())), txt = ev.run(); S.calamity = 0; report.push(['💥', 'Calamité ! ' + txt, 'bad']); addLog(txt, 'bad'); sfx('bad'); renderAll(); await banner('💥 Calamité !', esc(txt), 2400); S.stats.calmNights = 0; } else S.stats.calmNights++;
    setPhase('raid');
    if (S.raid) { report.push(['sec', 'Raid']); await runRaid(report); renderAll(); }
    setPhase('contrecoup');
    if (S.hype >= 3) S.menace += 1;
    renderHUD();
    if (S.menace >= MENACE_MAX) { S.menace = 0; renderHUD(); report.push(['sec', 'Contrecoup']); await runInvasion(report); }
    else await banner('Contrecoup', `Menace ${S.menace}/${MENACE_MAX} : pas d’aventuriers cette nuit`, 1100);
    setPhase('aube');
    dawn(report);
    const gd = checkGoals(); if (gd.length) report.push(['sec', 'Envies comblées']);
    gd.forEach(g => { report.push(['✦', `${g.text} → ${rewardText(g.reward)}`, 'ev']); addLog(`Envie comblée : ${g.text}.`, 'ev'); });
    const qd = checkQuests(); qd.forEach(c => report.push(['✨', `${c.name} a accompli sa mission « ${c.quest.title} » : va réclamer sa récompense !`, 'good']));
    if (COOP.role === 'host') S.stats.coopNights++;
    const ad = checkAch(); if (ad.length) report.push(['sec', 'Hauts faits']);
    ad.forEach(a => report.push([a.ico, `${a.name} : pouvoir « ${a.pw} » débloqué. ${a.pd}`, 'ev']));
    S.rooms.forEach(r => { if (r.justBuilt) { delete r.justBuilt; poof(r.x, r.y, r.w, r.h); V.flash.push({ cells: cellsOf(r), t: performance.now() }); } });
    save(); renderAll();
    await chronicle(n, report);
  } catch (err) { console.error(err); toast('Oups, la nuit a trébuché. La partie continue.', true); }
  checkGoals().forEach(g => toast(`✦ Envie comblée : ${g.text}`));
  setPhase('roder'); UI.busy = false; document.body.classList.remove('busy'); $('#btnNight').disabled = false;
  renderAll(); save(); coopNightDone(); valAfterNight();
  if (S.tier >= 3 && !S.won) { S.won = true; save(); openModal(`<h2>👑 Château légendaire !</h2><p>${esc(S.name)} est désormais le château le plus douillet et le plus redouté du Val Douillet. Les bardes en font des berceuses.</p><p>Tu peux continuer à meubler et accueillir des créatures autant que tu veux.</p><div class="mfoot"><button class="sbtn pri" data-close type="button">Continuer</button></div>`); }
}
function chronicle(n, report) {
  coopCast('chron', { n, report });
  const items = report.map(([e, t, tone], i) => e === 'sec' ? `<li class="sec">${esc(t)}</li>` : `<li class="${tone}" style="animation-delay:${Math.min(i, 14) * 50}ms"><span class="emo">${e}</span><span>${esc(t)}</span></li>`).join('');
  const m = openModal(`<h2>Chronique de la nuit ${n}</h2><p class="hint">${esc(S.name)} · ${esc(castleTitle())}</p><ul class="chron">${items}</ul>
    <div class="mfoot"><button class="sbtn pri" type="button" id="cNext" data-focus>🌙 Nuit ${S.night}</button></div>`, { noClose: true, label: 'Chronique' });

  return new Promise(res => m.querySelector('#cNext').addEventListener('click', () => { closeModal(true); res(); }, { once: true }));

function fld(t, k, f, label, type = 'num', o = {}) {
  const v = getv(t, k, f), b = `${t}|${k}|${f}|${type}`, chg = isChanged(t, k, f) ? ' chg' : '';

  if (type === 'num') input = `<input type="number" step="${o.step || 1}"${o.min != null ? ` min="${o.min}"` : ''}${o.max != null ? ` max="${o.max}"` : ''} value="${v ?? ''}" data-b="${b}">`;
  else if (type === 'range') input = `<span class="rng"><input type="range" min="${o.min}" max="${o.max}" step="${o.step}" value="${v ?? 0}" data-b="${b}"><output>${v ?? 0}</output></span>`;
  else if (type === 'text') input = `<input type="text" value="${esc(v ?? '')}" data-b="${b}">`;
  else if (type === 'area') input = `<textarea rows="${o.rows || 2}" data-b="${b}">${esc(v ?? '')}</textarea>`;
  else if (type === 'lines') input = `<textarea rows="${o.rows || 3}" data-b="${b}">${esc((v || []).join('\n'))}</textarea>`;
  else if (type === 'color') input = `<span class="colw"><input type="color" value="${v || '#888888'}" data-b="${b}"${v ? '' : ' class="none"'}>${o.opt ? `<button type="button" class="mini" data-act="unset" data-arg="${b}" title="Retirer">×</button>` : ''}</span>`;
  else if (type === 'sel' || type === 'seln') input = `<select data-b="${b}">${o.opts.map(([val, lab]) => `<option value="${esc(val)}"${String(v ?? '') === String(val) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  else if (type === 'bool') input = `<input type="checkbox"${v ? ' checked' : ''} data-b="${b}">`;
  return `<label class="af${chg}${type === 'area' || type === 'lines' ? ' wide' : ''}${type === 'bool' ? ' chk' : ''}"><span>${esc(label)}</span>${input}</label>`;
}
function parseField(el, type) {
  if (type === 'num' || type === 'range' || type === 'seln') { const n = parseFloat(el.value); return isNaN(n) ? undefined : n; }
  if (type === 'bool') return el.checked;
  if (type === 'lines') return el.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (type === 'sel') return el.value === '' ? undefined : el.value;
  return el.value;
}

function startPreview(cvs, kind, key, o = {}) { ADMIN.preview = { cv: cvs, kind, key, walk: false, flip: false, lit: true, zoom: 1, ...o }; requestAnimationFrame(previewFrame); }
function previewFrame(t) {
  const p = ADMIN.preview; if (!p || !ADMIN.open || !p.cv.isConnected) return; requestAnimationFrame(previewFrame);
  const c = p.cv, dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = g.createRadialGradient(w / 2, h * .66, 10, w / 2, h * .66, w * .8); bg.addColorStop(0, '#3c2c20'); bg.addColorStop(1, '#0c090b'); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const s = Math.min(w / 320, h / 260) * p.zoom; g.save(); g.translate(w / 2, h * .72); g.scale(s, s);
  g.save(); g.transform(64 / TEXT, 32 / TEXT, -64 / TEXT, 32 / TEXT, 0, -64); g.drawImage(roomTexture({ id: 'adm-floor', t: 'taverne', w: 2, h: 2, built: true }), 0, 0); g.restore();
  shadowEll(g, 0, 2, 30, 15, .45);
  const person = p.kind === 'char' || p.kind === 'hero', spr = getSprite(p.kind, p.key), k = AU / SQ() * (person ? 1.08 : p.kind === 'x' ? 1.2 : 1);
  const bob = p.walk ? Math.abs(Math.sin(t / 95)) * 5 : 0, breath = person && !p.walk ? 1 + Math.sin(t / 520) * .018 : 1;
  g.save(); g.translate(0, -bob); if (p.flip) g.scale(-1, 1); g.scale(k, k * breath); g.drawImage(spr.img, -spr.ax, -spr.ay); g.restore();
  if (p.kind === 'furn') (FLAMES[p.key] || FLAMES[(FURN[p.key] || {}).sprite] || []).forEach(([ax, ay, az, sc], i) => { const [px, py] = pt(ax, ay, az); drawFlame(g, px * AU, py * AU, sc * 1.9, t, i * 3); });
  g.restore();
  if (p.lit) { const lg = g.createRadialGradient(w / 2, h * .62, Math.min(w, h) * .18, w / 2, h * .62, Math.max(w, h) * .7); lg.addColorStop(0, 'rgba(12,9,28,0)'); lg.addColorStop(1, `rgba(12,9,28,${TUNE.ambient})`); g.fillStyle = lg; g.fillRect(0, 0, w, h); g.globalCompositeOperation = 'lighter'; const gl = g.createRadialGradient(w / 2, h * .6, 0, w / 2, h * .6, w * .4); gl.addColorStop(0, 'rgba(255,176,96,.18)'); gl.addColorStop(1, 'rgba(255,176,96,0)'); g.fillStyle = gl; g.fillRect(0, 0, w, h); g.globalCompositeOperation = 'source-over'; }
}

/* ---------- événements de l'atelier (un seul écouteur délégué) ---------- */
function bindAdmin() {
  const root = $('#admin');
  const onField = e => {
    const el = e.target, b = el.dataset && el.dataset.b; if (!b) return;
    const [t, k, f, type] = b.split('|'); const v = parseField(el, type);
    if (type === 'range') { const out = el.parentElement.querySelector('output'); if (out) out.textContent = v; }
    if (type === 'color') el.classList.remove('none');
    setv(t, k, f, v, type === 'bool'); const lab = el.closest('.af'); if (lab) lab.classList.add('chg');
  };
  root.addEventListener('input', e => { if (e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') onField(e); });
  root.addEventListener('change', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') onField(e); });
  root.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || !root.contains(a)) return; const fn = ACTIONS[a.dataset.act]; if (fn) fn(a.dataset.arg, a, e); });
  $('#btnAdmin').addEventListener('click', openAdmin);
  $('#adminFab').addEventListener('click', openAdmin);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ADMIN.open && !$('#modalRoot').children.length) closeAdmin(); });
}
Object.assign(ACTIONS, {

function normGen(o) {
  o = o || {}; const a = o.art || {};
  const n = (v, lo, hi, d = 0) => { v = Math.round(+v); return isNaN(v) ? d : clamp(v, lo, hi); };
  const one = (v, list, d) => list.includes(v) ? v : d, hex = v => /^#[0-9a-f]{6}$/i.test(v || '') ? v : null;
  const rooms = Object.keys(ROOMS).filter(k => !isHall({ t: k }));
  const sp = { name: String(o.name || 'Créature').slice(0, 24), from: one(o.from, rooms, 'dortoir'), tier: n(o.tier, 0, 2), guard: n(o.guard, 0, 5, 1), dice: n(o.dice, 0, 3, 1), tag: one(o.tag, Object.keys(TAGS), 'ruse'),
    likes: one(o.likes, Object.keys(FURN), 'torche'), skill: String(o.skill || 'Talent mystère').slice(0, 32), sd: String(o.sd || '').slice(0, 180), lines: (Array.isArray(o.lines) ? o.lines : []).map(String).filter(Boolean).slice(0, 4) };
  if (!sp.lines.length) sp.lines = ['…'];
  ['gold', 'mat', 'hype', 'cal', 'amb', 'build'].forEach(k => { const v = n(o[k], 0, 2); if (v) sp[k] = v; });
  if (+o.eats === 2) sp.eats = 2; if (o.rival && SPECIES[o.rival]) sp.rival = o.rival;
  const art = { sc: clamp(+a.sc || 1, .7, 1.35), skin: hex(a.skin) || '#86bd45', body: hex(a.body) || '#7d5f3d', ears: one(a.ears, ART_OPTS.ears.map(x => x[0]), ''), eyes: one(a.eyes, ART_OPTS.eyes.map(x => x[0]), 'normal'),
    nose: one(a.nose, ART_OPTS.nose.map(x => x[0]), 'small'), mouth: one(a.mouth, ART_OPTS.mouth.map(x => x[0]), 'grin'), hat: one(a.hat, ART_OPTS.hat.map(x => x[0]), ''), hairStyle: one(a.hairStyle, ART_OPTS.hairStyle.map(x => x[0]), ''), item: one(a.item, ART_OPTS.item.map(x => x[0]), '') };
  ['iris', 'hair', 'hatc', 'belly', 'cape', 'wings', 'tail', 'horns', 'beard'].forEach(k => { if (hex(a[k])) art[k] = a[k]; });
  if (art.hat && !art.hatc) art.hatc = '#6a4a8a'; if (art.hairStyle && !art.hair) art.hair = '#4a3020'; if (a.brow) art.brow = true;
  return { sp, art };
}

function diffLines() {

}

function repTarget(sp) {

  const f = [];

  else if (d.fromDecor) { const ok = countItem('toile') >= d.fromDecor.toile; f.push([ok ? 'Toiles accueillantes' : 'Pas assez de toiles', ok ? 25 : 0]); }
  else if (d.from && ROOMS[d.from]) { const n = nestsOf(sp); f.push(n ? [`${ROOMS[d.from].name} meublée${n > 1 ? ' (' + n + ' pièces)' : ''}`, Math.min(32, 22 + (n - 1) * 5)] : [`Pas de ${ROOMS[d.from].name} meublée`, 0]); }
  if (d.likes && FURN[d.likes]) f.push(hasItem(d.likes) ? [`${itemName(d.likes)} au château`, 10] : [`Pas de ${itemName(d.likes)}`, 0]);
  const mates = S.creatures.filter(c => c.sp === sp && !c.away);
  if (mates.length) {
    const m = mates.reduce((a, c) => a + c.mood, 0) / mates.length, e = mates.reduce((a, c) => a + (c.epa == null ? 50 : c.epa), 0) / mates.length;
    f.push([`Humeur des siens (${m.toFixed(1)}/5)`, Math.round(m * 4)]);
    f.push([`Épanouissement des siens (${Math.round(e)})`, Math.round(e / 10)]);
  }
  const amb = ambiance(); f.push([`Ambiance ${amb}`, Math.min(15, Math.round(amb * .7))]);
  if (S.hype) f.push([`Notoriété ${S.hype}`, Math.min(10, Math.floor(S.hype / 3))]);
  if (S.tier) f.push([`Palier ${S.tier}`, S.tier * 3]);
  if (d.rival && SPECIES[d.rival] && countSp(d.rival)) f.push([`Des ${SPECIES[d.rival].name.toLowerCase()}s rôdent`, -10]);
  const des = (S.desertLog || []).filter(x => x.sp === sp && S.night - x.n < 6).length; if (des) f.push(['Désertions récentes', -8 * des]);
  const pw = pwRep(); if (pw) f.push(['Pouvoirs du château', pw]);
  const art = ARTEFACTS.filter(k => FURN[k].repSp === sp && hasItem(k)); if (art.length) f.push([`${itemName(art[0])} exposé`, 12]);
  if (d.rare && typeof radiance === 'function') { const g = radiance(); f.push([`Rayonnement ${g}`, Math.min(15, Math.floor(g / 10))]); }
  return { v: clamp(Math.round(f.reduce((a, x) => a + x[1], 0)), 0, 100), f };
}

/* ---------- niveaux ---------- */
const LVL_XP = [0, 0, 3, 7, 12, 18];
const LVL_PERK = { 2: '+1 🛡️ en garde', 3: '+1 🎲 en raid', 4: 'ne boude plus jamais (humeur 2 minimum)', 5: 'sa compétence compte une fois de plus' };
const guardOf = c => ((SPECIES[c.sp] || {}).guard || 0) + (c.lvl >= 2 ? 1 : 0);
const diceOf = c => { const d = (SPECIES[c.sp] || {}).dice || 0; return d > 0 ? d + (c.lvl >= 3 ? 1 : 0) : 0; };
function gainXP(c, n, lines) {
  c.xp = (c.xp || 0) + n + (PW('chouchou') ? 1 : 0);
  while ((c.lvl || 1) < 5 && c.xp >= LVL_XP[(c.lvl || 1) + 1]) {
    c.lvl = (c.lvl || 1) + 1;
    const t = `${c.name} passe niveau ${c.lvl} : ${LVL_PERK[c.lvl]} !`;
    if (lines) lines.push(['🌟', t, 'good']); else toast('🌟 ' + t);
    addLog(t, 'good');
  }
}

/* ---------- l’aube des âmes ---------- */
function soulsDawn(report) {
  const out = [], hungry = hungrySet();
  // retours d’expédition
  S.creatures.forEach(c => {
    if (!c.away || c.expe || S.night + 1 < c.awayUntil) return;
    const q = questOf(c), sp = SPECIES[c.sp] || {}, e = EXPE[c.sp] || EXPE._;
    const pool = Math.max(1, diceOf(c) + Math.floor((c.lvl || 1) / 2) + (c.mood >= 4 ? 1 : 0)), roll = rollPool(pool);
    c.away = 0; c.awayUntil = 0; c.raid = false; c.back = true;
    if (q) { q.st = 'done'; q.res = roll.res; q.dice = roll.dice; }
    S.stats.expeditions++;
    out.push(['🧭', `${c.name} (${sp.name}) ${roll.res === 'fail' ? e[3] : e[2]}. (${roll.dice.join(', ')})`, roll.res === 'fail' ? '' : 'good']);
  });
  // épanouissement & loyauté
  S.creatures.forEach(c => {
    if (c.away) return;
    const t = epaFactors(c, hungry).target;
    c.epa = Math.round((c.epa == null ? 50 : c.epa) * .6 + t * .4);
    addLoy(c, loyDelta(c));
  });
  // tentations & désertions
  const leaving = [];
  S.creatures.forEach(c => {
    const best = temptation(c);
    if (!best) { if (c.tempt) { out.push(['🙂', `${c.name} renonce finalement à partir.`, 'good']); delete c.tempt; } return; }
    if (c.tempt && Math.random() < desertChance(c, best)) { leaving.push([c, best]); return; }
    if (!c.tempt) out.push(['👀', `${c.name} (${SPECIES[c.sp].name}) lorgne vers ${best.name} : là-bas, les ${SPECIES[c.sp].name.toLowerCase()}s sont mieux reçus (${Math.round(best.v)} contre ${repOf(c.sp)}). Rassure-le·la !`, 'bad']);
    c.tempt = { name: best.name, master: best.master, v: best.v, pk: best.pk || null, n: S.night };
  });
  leaving.forEach(([c, best]) => {
    S.creatures = S.creatures.filter(x => x !== c);
    S.desertLog.push({ sp: c.sp, n: S.night }); if (S.desertLog.length > 30) S.desertLog.shift();
    S.stats.deserted++;
    out.push(['🧳', `${c.name} (${SPECIES[c.sp].name}) est parti·e rejoindre ${best.name}${best.master ? ' de ' + best.master : ''}.`, 'bad']);
    addLog(`${c.name} a déserté pour ${best.name}.`, 'bad');
    if (best.pk && typeof valMigrate === 'function') valMigrate(c, best);
  });
  // nouvelles demandes
  if (S.night >= 3 && !(S.tuto && S.tuto.on)) {
    const elig = S.creatures.filter(c => !c.quest && !isOut(c) && c.mood >= 2 && S.night - (c.joined || 1) >= 1 && (!c.legend || S.night - (c.lastExpe || 0) >= 5)).sort(() => Math.random() - .5);
    for (const c of elig) {
      if (liveQuests() >= questSlots()) break;
      if (Math.random() > .35) continue;
      const q = genQuest(c); if (!q) continue;
      c.quest = q; out.push([QT[q.k].ico, `${c.name} a une demande : « ${q.title} ». Clique sur son portrait.`, 'ev']);
    }
  }
  if (out.length) { report.push(['sec', 'Âmes du château']); out.forEach(l => report.push(l)); }
}

/* ---------- pouvoirs actifs ---------- */
function usePower(id, a) {
  const ach = ACH.find(x => x.active === id); if (!ach || !PW(ach.id)) return 'Pouvoir verrouillé';
  if (!pwReady(ach)) return `Disponible à la nuit ${S.pwcd[id]}`;
  if (id === 'brume') { if (S.menace <= 0) return 'La Menace est déjà à zéro'; S.menace = Math.max(0, S.menace - 3); addLog('Brume du soir : −3 Menace.', 'ev'); }
  else if (id === 'festin') { homeCreatures().forEach(c => { c.mood = clamp(c.mood + 1, 0, 5); }); addLog('Grand festin : tout le monde se régale.', 'ev'); }
  else if (id === 'rappel') { const c = a && critter(a.id); if (!c || !c.tempt) return 'Personne n’est tenté de partir'; addLoy(c, 25); delete c.tempt; addLog(`Cloche du rappel : ${c.name} reste.`, 'ev'); }
  S.pwcd[id] = S.night + ach.cd;
  return null;
}

/* ---------- commandes (toutes les actions qui modifient la partie) ---------- */
const CMD = {
  place(a) { return withZ(Number.isInteger(a.z) && a.z >= -DEPTH_MAX && a.z <= HEIGHT_MAX ? a.z : Z, () => CMD.place0(a)); },
  place0(a) {
    const { kind, t } = a, x = a.x | 0, y = a.y | 0, w = a.w | 0 || 1, h = a.h | 0 || 1;
    if (Z !== 0 && !S.rooms.some(r => zOf(r) === Z)) return 'Cet étage n’existe pas encore';
    if (!(kind === 'room' ? ROOMS[t] : kind === 'def' ? DEFS[t] : kind === 'furn' ? FURN[t] : null)) return 'Sticker inconnu';
    const av = availability(kind, t);
    if (av && av.hide) return 'Indisponible pour ce château';
    if (av && av.lock) return `Nécessite : ${av.reason}`;
    if (av && av.poor) return `Il te faut ${costText(costOf(kind, t))}`;
    if (kind === 'room') { const z = ROOMS[t].size; if (!((w === z[0] && h === z[1]) || (w === z[1] && h === z[0]))) return 'Taille invalide'; }
    const err = kind === 'room' ? checkRoom(t, x, y, w, h) : kind === 'def' ? checkDef(t, x, y) : checkFurn(t, x, y);
    if (err) return err;
    if (kind === 'room') { const r = placeRoom(t, x, y, w, h); V.flash.push({ cells: cellsOf(r), t: performance.now() }); poof(x, y, w, h); if (t !== 'couloir') floatText(x + w / 2, y + h / 2, `Chantier : ${ROOMS[t].clock} segments`); }
    else if (kind === 'def') { const d = placeDef(t, x, y); V.born.set(d.id, performance.now()); poof(x + .2, y + .2, .6, .6); }
    else { const f = placeFurn(t, x, y); V.born.set(f.id, performance.now()); poof(x + .2, y + .2, .6, .6); const fd = FURN[t], main = ['beds', 'food', 'amb', 'gold', 'mat', 'hype'].find(k => fd[k]); if (main) floatText(x + .5, y + .5, `+${fd[main]} ${STAT_LABELS[main][0]}`); }
    return null;
  },
  unstick(a) { const f = S.furn.find(x => x.id === a.id); if (!f) return 'Déjà décollé'; if (f.fixed) return 'Ce meuble est fixé à la pièce'; removeFurn(f); return null; },
  removeDef(a) { const d = S.defs.find(x => x.id === a.id); if (!d) return 'Déjà décollé'; removeDef(d); return null; },
  removeRoom(a) {
    const r = S.rooms.find(x => x.id === a.id); if (!r) return 'Déjà décollée';
    const err = removeCheck(r); if (err) return err;
    poof(r.x, r.y, r.w, r.h); removeRoom(r); addLog(`${ROOMS[r.t].name} décollé.`); return null;
  },
  push(a) {
    const r = S.rooms.find(x => x.id === a.id); if (!r || r.built) return 'Ce chantier est terminé'; if (S.gold < 2) return 'Il te faut 2 💰';
    const d = ROOMS[r.t]; S.gold -= 2; r.prog++;
    if (r.prog >= d.clock) { r.built = true; roomBuilt(r); dirty(); poof(r.x, r.y, r.w, r.h); addLog(`${d.name} terminé.`, 'good'); }
    return null;
  },
  pet(a) { const c = critter(a.id); if (!c || isOut(c)) return 'Absent·e'; if (c.pet) return 'Déjà caressé·e cette nuit'; c.pet = 1; c.mood = clamp(c.mood + 1, 0, 5); c.petN = (c.petN || 0) + 1; S.stats.pets++; addLoy(c, 2 + (PW('calins') ? 3 : 0)); return null; },
  treat(a) { const c = critter(a.id); if (!c || isOut(c)) return 'Absent·e'; if (c.treat) return 'Déjà gâté·e cette nuit'; if (S.gold < 1) return 'Il te faut 1 💰'; S.gold -= 1; c.treat = 1; c.mood = clamp(c.mood + 1, 0, 5); addLoy(c, 2); return null; },
  post(a) {
    const c = critter(a.id); if (!c || isOut(c)) return 'Absent·e';
    if (a.post) { const r = S.rooms.find(x => x.id === a.post); if (!r || !r.built || isHall(r)) return 'Pièce indisponible'; }
    c.post = a.post || null; return null;
  },
  fire(a) { const c = critter(a.id); if (!c || isOut(c)) return 'Absent·e'; S.creatures = S.creatures.filter(x => x !== c); addLog(`${c.name} a été renvoyé·e.`); return null; },
  reassure(a) { const c = critter(a.id); if (!c || !c.tempt) return 'Pas besoin'; if (c.reassured === S.night) return 'Déjà rassuré·e cette nuit'; c.reassured = S.night; addLoy(c, c.epa >= 50 ? 10 : 6); return null; },
  qAccept(a) {
    const c = critter(a.id), q = c && questOf(c); if (!q || q.st !== 'offered') return 'Plus de demande';
    if (QT[q.k].away) { if (isOut(c)) return 'Absent·e'; if (S.raid) S.raid.team = S.raid.team.filter(id => id !== c.id); c.raid = true; c.away = q.nights; c.awayUntil = S.night + q.nights; c.post = null; q.st = 'away'; critterLeave(c.id); addLog(`${c.name} part en mission : ${q.title}.`, 'ev'); }
    else { q.st = 'active'; let ok = false; try { ok = QT[q.k].test(q, c); } catch (e) {} if (ok) q.st = 'done'; }
    return null;
  },
  qDecline(a) { const c = critter(a.id), q = c && questOf(c); if (!q || q.st !== 'offered') return 'Plus de demande'; delete c.quest; return null; },
  qClaim(a) {
    const c = critter(a.id), q = c && questOf(c); if (!q || q.st !== 'done') return 'Rien à réclamer';
    const rw = questReward(q); S.gold += rw.g || 0; S.hype += rw.h || 0; addLoy(c, rw.loy || 0);
    if (q.res === 'fail') c.mood = clamp(c.mood - 1, 0, 5);
    if (rw.gift) { const k = (SPECIES[c.sp].likes && FURN[SPECIES[c.sp].likes]) ? SPECIES[c.sp].likes : pick(DECOR_ORDER); S.free[k] = (S.free[k] || 0) + 1; }
    if (rw.rare) S.free.cristal = (S.free.cristal || 0) + 1;
    gainXP(c, rw.xp || 0);
    c.questAt = S.night; S.stats.quests++;
    if (q.k === 'expe') { c.lastExpe = S.night; if (!c.legend) { c.legend = true; S.stats.legends++; addLog(`${c.name} entre dans la légende !`, 'ev'); } }
    if (q.ch <= 3) c.story = Math.max(c.story || 0, q.ch);
    addLog(`Mission accomplie : ${q.title} (${c.name}).`, 'good');
    delete c.quest; return null;
  },
  raidPlan(a) {
    const tg = RAIDS[a.target]; if (!tg) return 'Cible inconnue'; if (tg.tier > S.tier) return `Palier ${tg.tier} requis`;
    const team = [...new Set(a.team || [])].slice(0, 3).map(critter).filter(c => c && diceOf(c) > 0 && (!isOut(c) || (S.raid && S.raid.team.includes(c.id) && !c.away)));
    if (!team.length) return 'Personne ne peut partir';
    cancelRaid(); S.raid = { target: a.target, team: team.map(c => c.id) };
    team.forEach(c => { c.raid = true; say(c.id, pick(['En route !', 'On ramène quoi, chef ?', 'Je prends mon sac.']), 1800); critterLeave(c.id); });
    addLog(`Raid prévu : ${tg.name}.`, 'ev'); return null;
  },
  raidCancel() { cancelRaid(); return null; },
  tierUp() { const st = tierStatus(); if (!st || !st.ok) return 'Conditions non remplies'; pay(st.next.cost); S.tier++; addLog(`Le château atteint le Palier ${S.tier} !`, 'ev'); return null; },
  power(a) { return usePower(a.pw, a); },
  expand() { return expandCastle(); },
  rename(a) { const n = String(a.name || '').trim().slice(0, 40); if (!n) return 'Nom vide'; S.name = n; return null; },
};
// exécute une commande : en solo tout de suite, en château partagé elle passe aussi par l’hôte
function cmd(name, a = {}) {
  if (typeof VISIT !== 'undefined' && VISIT) return 'Tu es en visite chez un voisin : rien ne se touche !';
  const f = CMD[name]; if (!f) return 'Action inconnue';
  const role = typeof COOP !== 'undefined' ? COOP.role : null;
  if (role === 'guest') {
    if (COOP.busy) return 'La nuit se joue chez l’hôte, patience…';
    if (name === 'rename') return 'Seul l’hôte peut renommer son château';
    const err = f(a); if (err) return err;
    coopSend({ t: 'cmd', c: name, a }); return null;
  }
  const err = f(a);
  if (!err && role === 'host') coopDirty();
  return err;
}

/* ---------- fenêtres : hauts faits, renommée ---------- */
function openAch() {
  const n = ACH.filter(a => S.ach[a.id]).length, cats = [...new Set(ACH.map(a => a.cat))];
  const actives = ACH.filter(a => a.active && S.ach[a.id]);
  const pwHtml = actives.length ? actives.map(a => {
    const ready = pwReady(a), tempted = a.active === 'rappel' ? S.creatures.filter(c => c.tempt) : null;
    const btn = a.active === 'rappel'
      ? (tempted.length ? tempted.map(c => `<button class="sbtn" type="button" data-pw="rappel" data-id="${c.id}" ${ready ? '' : 'disabled'}>🔔 Retenir ${esc(c.name)}</button>`).join('') : '<span class="hint">Personne n’est tenté de partir.</span>')
      : `<button class="sbtn pri" type="button" data-pw="${a.active}" ${ready ? '' : 'disabled'}>⚡ Activer</button>`;
    return `<div class="pwrow"><span class="emo">${a.ico}</span><span><b>${esc(a.pw)}</b><br><span class="hint">${esc(a.pd)} Recharge : ${a.cd} nuits.${ready ? '' : ` Prêt à la nuit ${S.pwcd[a.active]}.`}</span></span><span class="btnrow">${btn}</span></div>`;
  }).join('') : '<p class="hint">Certains hauts faits débloquent des pouvoirs à activer (Brume du soir, Grand festin, Cloche du rappel).</p>';
  const m = openModal(`<h2>🏆 Hauts faits</h2><p class="hint">${n}/${ACH.length} débloqués. Chaque haut fait offre un pouvoir permanent à ton château.</p>
    <h3>Pouvoirs à activer</h3><div class="pwlist">${pwHtml}</div>
    ${cats.map(cat => `<h3>${esc(cat)}${cat === 'Val des Maîtres' && !netUsable() ? ' <small class="hint">(version en ligne)</small>' : ''}</h3><div class="achgrid">${ACH.filter(a => a.cat === cat).map(a => {
      const on = !!S.ach[a.id];
      return `<div class="ach ${on ? 'on' : ''}"><span class="emo">${on ? a.ico : '🔒'}</span><b>${esc(a.name)}</b><span>${esc(a.desc)}</span><span class="pw">${on ? '⚡' : '🎁'} ${esc(a.pw)} : ${esc(a.pd)}</span>${on ? `<small>Nuit ${S.ach[a.id]}</small>` : ''}</div>`;
    }).join('')}</div>`).join('')}`, { wide: true, label: 'Hauts faits' });
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-pw]'); if (!b || b.disabled) return;
    const err = cmd('power', { pw: b.dataset.pw, id: b.dataset.id });
    if (err) { toast(err, true); sfx('bad'); return; }
    sfx('chime'); toast('⚡ Pouvoir activé !'); afterChange(); openAch();
  });
}
function openRenown() {
  const known = SPECIES_ORDER.filter(sp => S.album[sp]), unknown = SPECIES_ORDER.filter(sp => !S.album[sp]);
  const row = sp => {
    const d = SPECIES[sp], v = repOf(sp), t = repTarget(sp), best = bestRival(sp), trend = t.v > v + 2 ? '↗' : t.v < v - 2 ? '↘' : '→';
    const mates = S.creatures.filter(c => c.sp === sp).length;
    return `<details class="reprow"><summary><img class="th" alt="" src="${thumb('char', sp)}"><span class="who"><b>${esc(d.name)}</b><span>${mates ? `${mates} au château` : 'aucun au château'}${best ? ` · rival : ${esc(best.name)} ${Math.round(best.v)}` : ''}</span></span>${stars(v)}<span class="num repv ${best && best.v > v ? 'low' : ''}">${v} <i>${trend}</i></span></summary>
      <div>${t.f.map(([l, n]) => `<span class="tag2">${n > 0 ? '+' + n : n < 0 ? n : '·'} ${esc(l)}</span>`).join('')}<p class="hint">Visée : ${t.v}. La réputation rejoint doucement sa visée à chaque aube.</p></div></details>`;
  };
  const vr = typeof valRivals === 'function' ? valRivals() : [];
  openModal(`<h2>⭐ Renommée du château</h2>
    <p>Chaque espèce juge ton château : pièces qui lui plaisent, sticker préféré, humeur et épanouissement des siens, ambiance. Plus ta réputation est haute, plus elle vient volontiers… et moins ses membres sont tentés d’aller voir ailleurs.</p>
    <p class="hint">Une créature peu loyale (moins de 40) peut lorgner vers un château mieux réputé pour son espèce. Elle te prévient une nuit à l’avance : rassure-la, caresse-la, confie-lui une mission. Désertions : ${({ on: 'activées', soft: 'douces', off: 'désactivées' })[S.opts.desert]} (menu ⚙️).</p>
    <h3>Ta réputation</h3><div class="replist">${known.map(row).join('') || '<p class="hint">Accueille des créatures pour te faire une réputation.</p>'}</div>
    ${unknown.length ? `<p class="hint">${unknown.length} espèce${unknown.length > 1 ? 's' : ''} encore inconnue${unknown.length > 1 ? 's' : ''}.</p>` : ''}
    <h3>Les châteaux rivaux</h3><div class="rivals">${RIVALS.map(r => `<div class="rival"><span class="emo">${r.emo}</span><span><b>${esc(r.name)}</b><br><span class="hint">Tenu par ${esc(r.master)}. Prisé des ${r.likes.map(s => SPECIES[s] ? SPECIES[s].name.toLowerCase() + 's' : s).join(', ')}.</span></span></div>`).join('')}
    ${vr.length ? `<p class="hint">+ ${vr.length} château${vr.length > 1 ? 'x' : ''} de joueurs du Val des Maîtres.</p>` : ''}</div>`, { wide: true, label: 'Renommée' });
}
function bindSouls() {
  $('#btnRen').addEventListener('click', () => { if (!UI.busy) openRenown(); });
  $('#btnAch').addEventListener('click', () => { if (!UI.busy) openAch(); });
  $('#btnQuests').addEventListener('click', () => { if (!UI.busy) openMissions(); });
  bindVal(); updateRep();
}

/* =========================================================
   Réseau : identité de Maître et relais Nostr publics.
   Aucun compte ni serveur à entretenir : chaque joueur signe
   ses messages avec une clé gardée dans son navigateur.
   ========================================================= */
const NET_STORE = ['wss://nos.lol', 'wss://relay.primal.net', 'wss://nostr.mom', 'wss://relay.nostr.net'];
const NET_LIVE = ['wss://relay.snort.social', 'wss://relay.nostr.net', 'wss://nos.lol'];
const SITE_URL = 'https://laucans.github.io/cozy-stickers-dungeon/';
const ID_KEY = 'csd-identity-v1' + (PROFILE ? '-' + PROFILE : '');
const NET = { ok: false, why: '', sk: null, pk: '', name: '', relays: new Map(), seq: 0 };
const nowS = () => Math.floor(Date.now() / 1000);
const inClaude = () => !!(window.claude && window.claude.use);
const netUsable = () => NET.ok;
const bytesHex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
const hexBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rid = (n = 10) => bytesHex(crypto.getRandomValues(new Uint8Array(n)));
const cleanName = (v, n) => String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f<>]/g, '').trim().slice(0, n);

function initNet() {
  if (inClaude()) { NET.why = 'claude'; return; }
  if (!window.NostrTools || !window.WebSocket || !(window.crypto && crypto.subtle) || !window.isSecureContext) { NET.why = 'lib'; return; }
  try {
    let id = null; try { id = JSON.parse(localStorage.getItem(ID_KEY) || 'null'); } catch (e) {}
    if (!id || !/^[0-9a-f]{64}$/.test(id.sk || '')) { id = { sk: bytesHex(NostrTools.generateSecretKey()), name: '' }; localStorage.setItem(ID_KEY, JSON.stringify(id)); }
    NET.sk = hexBytes(id.sk); NET.pk = NostrTools.getPublicKey(NET.sk); NET.name = cleanName(id.name, 24);
    NET.ok = true;
  } catch (e) { NET.why = 'id'; console.error(e); return; }
  valBoot(); coopBoot();
}
function setMasterName(n) {
  NET.name = cleanName(n, 24);
  try { const id = JSON.parse(localStorage.getItem(ID_KEY)); id.name = NET.name; localStorage.setItem(ID_KEY, JSON.stringify(id)); } catch (e) {}
}

/* ---------- relais ---------- */
function relay(url) {
  let r = NET.relays.get(url); if (r) return r;
  r = { url, ws: null, open: false, q: [], subs: new Map(), pend: new Map(), wait: 1500, timer: 0 };
  NET.relays.set(url, r); relayConnect(r); return r;
}
function relayConnect(r) {
  let ws; try { ws = new WebSocket(r.url); } catch (e) { relayRetry(r); return; }
  r.ws = ws;
  ws.onopen = () => { r.open = true; r.wait = 1500; r.subs.forEach((s, id) => ws.send(JSON.stringify(['REQ', id, ...s.filters()]))); const q = r.q; r.q = []; q.forEach(m => ws.send(m)); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } relayMsg(r, m); };
  ws.onclose = () => { r.open = false; r.subs.forEach(s => s.end()); r.pend.forEach(p => p(false)); r.pend.clear(); relayRetry(r); };
  ws.onerror = () => {};
}
function relayRetry(r) { clearTimeout(r.timer); r.timer = setTimeout(() => relayConnect(r), r.wait); r.wait = Math.min(30000, r.wait * 2); }
function relaySend(r, m) { const s = JSON.stringify(m); if (r.open && r.ws.readyState === 1) r.ws.send(s); else if (r.q.length < 80) r.q.push(s); }
function relayMsg(r, m) {
  const s = r.subs.get(m[1]);
  if (m[0] === 'EVENT' && s && m[2]) s.onev(m[2], r.url);
  else if ((m[0] === 'EOSE' || m[0] === 'CLOSED') && s) s.end();
  else if (m[0] === 'OK') { const p = r.pend.get(m[1]); if (p) { r.pend.delete(m[1]); p(!!m[2], m[3]); } }
}
const relaysUp = urls => urls.filter(u => { const r = NET.relays.get(u); return r && r.open; }).length;

/* ---------- abonnements, requêtes, publications ---------- */
// filters : tableau, ou fonction qui le renvoie (recalculée à chaque reconnexion, pratique pour « since »)
function netSub(urls, filters, onev, oneose, ms = 5500) {
  const id = 'c' + (++NET.seq).toString(36) + rid(3), seen = new Set(), F = typeof filters === 'function' ? filters : () => filters;
  let left = urls.length, done = false;
  const fin = () => { if (!done) { done = true; clearTimeout(to); if (oneose) oneose(); } };
  const to = setTimeout(fin, ms);
  urls.forEach(u => {
    const r = relay(u); let ended = false;
    r.subs.set(id, { filters: F, onev: (ev, url) => { if (!ev.id || seen.has(ev.id)) return; seen.add(ev.id); if (seen.size > 4000) seen.clear(); onev(ev, url); }, end: () => { if (!ended) { ended = true; if (--left <= 0) fin(); } } });
    if (r.open && r.ws.readyState === 1) r.ws.send(JSON.stringify(['REQ', id, ...F()]));
  });
  return { close() { urls.forEach(u => { const r = NET.relays.get(u); if (r && r.subs.delete(id) && r.open) relaySend(r, ['CLOSE', id]); }); } };
}
function netQuery(urls, filters, ms = 6500) {
  return new Promise(res => { const out = []; let h = null, over = false; const end = () => { if (over) return; over = true; setTimeout(() => h && h.close(), 0); res(out); }; h = netSub(urls, filters, ev => out.push(ev), end, ms); });
}
function netPublish(urls, ev) {
  return Promise.all(urls.map(u => new Promise(res => {
    const r = relay(u), to = setTimeout(() => { r.pend.delete(ev.id); res(false); }, 8000);
    r.pend.set(ev.id, ok => { clearTimeout(to); res(ok); }); relaySend(r, ['EVENT', ev]);
  }))).then(a => a.filter(Boolean).length);
}
const sign = (kind, tags, content) => NostrTools.finalizeEvent({ kind, created_at: nowS(), tags, content }, NET.sk);
function safeVerify(ev) { try { return NostrTools.verifyEvent(ev); } catch (e) { return false; } }
const tagOf = (ev, k) => ((ev.tags || []).find(t => t[0] === k) || [])[1];

/* ---------- emballage : JSON compressé, chiffrement des salons ---------- */
async function packJSON(o) {
  const s = JSON.stringify(o);
  if (!window.CompressionStream) return 'j:' + s;
  const cs = new Blob([s]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return 'z:' + b64(new Uint8Array(await new Response(cs).arrayBuffer()));
}
async function unpackJSON(str) {
  if (typeof str !== 'string' || str.length > 400000) throw new Error('taille');
  if (str.startsWith('j:')) return JSON.parse(str.slice(2));
  if (str.startsWith('z:')) { const ds = new Blob([unb64(str.slice(2))]).stream().pipeThrough(new DecompressionStream('deflate-raw')); const txt = await new Response(ds).text(); if (txt.length > 2000000) throw new Error('taille'); return JSON.parse(txt); }
  throw new Error('format');
}
async function roomKeys(code) {
  const enc = new TextEncoder(), h = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)));
  return { tag: bytesHex(await h('csd-room-tag:' + code)).slice(0, 24), key: await crypto.subtle.importKey('raw', await h('csd-room-key:' + code), 'AES-GCM', false, ['encrypt', 'decrypt']) };
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), data = new TextEncoder().encode(await packJSON(obj));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data)), all = new Uint8Array(12 + ct.length);
  all.set(iv); all.set(ct, 12); return b64(all);
}
async function unseal(key, str) {
  const raw = unb64(str), pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
  return unpackJSON(new TextDecoder().decode(pt));
}

function cleanSummary(o, ev) {

function valIngest(ev) {

/* ---------- courrier : cadeaux, livre d’or, escarmouches, arrivants ---------- */
function valInboxBoot() {
  const since = Math.max(nowS() - 21 * 86400, ((S && S.val && S.val.inboxAt) || 0) - 3600);
  VAL.inbox = netSub(NET_STORE, () => [{ kinds: [30078], '#p': [NET.pk], since, limit: 300 }], ev => valMail(ev), () => {}, 8000);
}
function valFlush() { const p = VAL.pending; VAL.pending = []; p.forEach(valMail); }
function valMail(ev) {
  if (!ev || ev.pubkey === NET.pk || !S || !S.val) return;
  if (VISIT || COOP.role === 'guest' || !S.started) { if (VAL.pending.length < 200) VAL.pending.push(ev); return; }
  if (S.val.claimed.includes(ev.id) || !safeVerify(ev)) return;
  const t = tagOf(ev, 't'); if (!['csd1-gift', 'csd1-gb', 'csd1-raid', 'csd1-migr'].includes(t)) return;
  let o; try { o = JSON.parse(ev.content); } catch (e) { return; } if (!o || typeof o !== 'object') return;
  S.val.claimed.push(ev.id); if (S.val.claimed.length > 500) S.val.claimed.splice(0, 100);
  S.val.inboxAt = Math.max(S.val.inboxAt || 0, ev.created_at);
  const who = cleanName(o.m, 24) || 'Un Maître', castle = cleanName(o.from, 40) || 'un château voisin', fresh = nowS() - ev.created_at < 21 * 86400;
  let text = '';
  if (t === 'csd1-gift' && fresh) {
    const x = PW('genereux') ? 2 : 1;
    if (o.k === 'g') { const n = clamp(+o.n || 0, 0, 3) * x; S.gold += n; text = `🎁 ${who} (${castle}) t’offre ${n} 💰.`; }
    else if (o.k === 's') { const n = clamp(+o.n || 0, 0, 3) * x; S.mat += n; text = `🎁 ${who} (${castle}) t’offre ${n} 🪵.`; }
    else if (o.k === 'f' && FURN[o.t] && FURN[o.t].room === 'any') { S.free[o.t] = (S.free[o.t] || 0) + x; text = `🎁 ${who} (${castle}) t’offre un sticker ${FURN[o.t].name}${x > 1 ? ' (×2)' : ''}.`; }
  } else if (t === 'csd1-gb') {
    S.stats.gbRecv++; const l = GB_LINES[clamp(+o.l || 0, 0, GB_LINES.length - 1)];
    text = `✍️ ${who} (${castle}) a signé ton livre d’or : « ${l} »`;
  } else if (t === 'csd1-raid' && fresh) {
    const loot = clamp(+o.loot || 0, 0, 20);
    if (o.res === 'fail') { S.hype += 1; S.gold += 2; homeCreatures().forEach(c => addLoy(c, 2)); text = `🛡️ Ton château a repoussé l’escarmouche de ${who} (${castle}) ! +1 🔥, +2 💰.`; }
    else { const lost = Math.min(S.gold, Math.ceil(loot / 2), 4); S.gold -= lost; text = `🏹 ${who} (${castle}) a mené une escarmouche${lost ? ` et chapardé ${lost} 💰` : ''}. Un bouclier protège ton château pendant 12 h.`; }
  } else if (t === 'csd1-migr' && fresh && SPECIES[o.sp] && (S.waiting || []).length < 6) {
    S.waiting.push({ sp: o.sp, name: cleanName(o.name, 24) || pick(NAMES), lvl: clamp(+o.lvl || 1, 1, 5), xp: clamp(+o.xp || 0, 0, 99), story: clamp(+o.story || 0, 0, 3), legend: !!o.legend, loy: 45, from: castle });
    text = `🧳 ${cleanName(o.name, 24)} (${SPECIES[o.sp].name}) quitte ${castle} et frappe à ta porte : ta réputation l’attire ! Il·elle entrera dès qu’un lit sera libre.`;
  }
  VAL.mail.unshift({ id: ev.id, t, at: ev.created_at, text: text || `${who} t’a écrit.`, who, castle, pk: ev.pubkey });
  VAL.unread = (VAL.unread || 0) + 1;
  if (VAL.mail.length > 80) VAL.mail.length = 80;
  if (text) { toast(text); addLog(text.replace(/^\S+ /, ''), 'ev'); }
  clearTimeout(VAL.mt); VAL.mt = setTimeout(afterChange, 250);
  if (VAL.open && VAL.tab === 'courrier') renderVal();
}
async function valSend(t, pk, content) {

/* ---------- visite d’un château voisin ---------- */
function visitState(m, c) {
  if (!m || !Array.isArray(m.rooms)) return null;
  const size = clamp(+m.size || 0, 0, SIZE_MAX), N = 12 + 2 * size;
  const s = upgradeState({ v: 2, seq: 1, name: c.name, theme: c.theme, started: true, night: c.night, gold: 0, mat: 0, hype: c.hype, tier: c.tier, calamity: 0, menace: 0, prisoners: 0, size,
    rooms: [], furn: [], defs: [], creatures: [], raid: null, goals: {}, album: {}, free: {}, log: [], usedNames: [], rep: c.rep, tuto: { on: false, done: true }, tipsOff: true, tips: {} });
  const inside = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && y >= 0 && x < N && y < N, okZ = z => Number.isInteger(z) && z >= -DEPTH_MAX && z <= HEIGHT_MAX, used = new Set();
  m.rooms.slice(0, 400).forEach(r => {
    if (!Array.isArray(r)) return; const [t, x, y, w, h, b, p] = r, z = okZ(r[7]) ? r[7] : 0;
    if (!ROOMS[t] || !inside(x, y) || !(w >= 1 && h >= 1 && w <= 3 && h <= 3 && x + w <= N && y + h <= N)) return;
    const cells = []; for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) cells.push(z + ':' + ((y + dy) * N + x + dx));
    if (cells.some(k => used.has(k))) return; cells.forEach(k => used.add(k));
    const room = { id: 'v' + s.seq++, t, x, y, w, h, built: !!b, prog: clamp(+p || 0, 0, 20) }; if (z) room.z = z; if (r[8]) room.land = true; s.rooms.push(room);
  });
  const spots = new Set();
  (m.furn || []).slice(0, 800).forEach(f => { if (!Array.isArray(f)) return; const [t, x, y] = f, z = okZ(f[3]) ? f[3] : 0, k = z + ':' + (y * N + x); if (FURN[t] && inside(x, y) && !spots.has(k)) { spots.add(k); const o = { id: 'v' + s.seq++, t, x, y }; if (z) o.z = z; s.furn.push(o); } });
  (m.defs || []).slice(0, 200).forEach(d => { if (!Array.isArray(d)) return; const [t, x, y] = d, k = '0:' + (y * N + x); if (DEFS[t] && inside(x, y) && !spots.has(k)) { spots.add(k); s.defs.push({ id: 'v' + s.seq++, t, x, y }); } });
  (m.crit || []).slice(0, 60).forEach(k => {
    if (!Array.isArray(k) || !SPECIES[k[0]]) return;
    const cr = upgradeCreature({ id: 'v' + s.seq++, sp: k[0], name: cleanName(k[1], 24) || '?', mood: clamp(+k[2] || 3, 0, 5), lvl: clamp(+k[3] || 1, 1, 5), legend: !!k[4], post: null, joined: 1 });
    const room = s.rooms[+k[5]]; if (room && room.built && !isHall(room)) cr.post = room.id;
    s.creatures.push(cr); s.album[cr.sp] = true;
  });
  if (!s.rooms.some(r => r.t === 'coeur')) return null;
  return s;
}
async function valVisit(pk) {

  toast(`🏰 En route vers ${c.name}…`);
  const evs = await netQuery(NET_STORE, [{ kinds: [30078], authors: [pk], '#d': ['csd1:map'], limit: 4 }], 6000);
  const ev = evs.filter(safeVerify).sort((a, b) => b.created_at - a.created_at)[0];
  if (!ev) { toast('Le plan de ce château est introuvable pour l’instant. Réessaie plus tard.', true); return; }

}

async function openSkirmish(pk) {
  const c = VAL.castles.get(pk); if (!c || !VISIT) return;
  const home = VISIT.back;
  if (!home.val.pvp || !c.pvp) { toast('Un des deux châteaux est pacifique.', true); return; }
