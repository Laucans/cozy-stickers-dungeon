<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cozy Stickers Dungeon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grenze+Gotisch:wght@600;800;900&family=Patrick+Hand&display=swap">
<style>
/* Mise en page : jeu plein écran — le château éclairé à la torche occupe tout le fond, l'interface flotte par-dessus en panneaux de cuir sombre cerclés de bronze (haut : ressources ; gauche : portraits ; bas : construction ; droite : envies et actions). Univers visuel unique et assumé. */
:root{
  --night:#0b0910; --leather:#1f1611; --leather-2:#2b1f17; --bronze:#8a6338; --bronze-2:#5a4028; --gold:#e9b949; --gold-2:#c99a4a;
  --cream:#f3e3c0; --cream-2:#cdb995; --ink:#2a1c16; --red:#c8413a; --red-2:#a0302b; --moss:#7fbf5a; --blue:#5a86d0;
  --parch:#f3e6c8; --parch-2:#e8d6b0; --parch-3:#d2ba8c; --ink-soft:#6e5444; --edge:#fffdf5;
  --f-display:"Grenze Gotisch",Georgia,serif; --f-body:"Andika","Segoe UI",system-ui,sans-serif; --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px)); --gt:max(10px, env(safe-area-inset-top, 0px)); --gb:max(10px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
/* au doigt, le navigateur ne zoome ni ne fait glisser la page (le château et la carte du Val ont leur propre zoom) */
html, body{touch-action:pan-x pan-y; overscroll-behavior:none} html{overflow:hidden}
body{margin:0; background:var(--night); color:var(--cream); font-family:var(--f-body); font-size:14px; line-height:1.35; overflow:hidden; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height:1}
.num{font-variant-numeric:tabular-nums}
#game{position:fixed; inset:0; overflow:hidden}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#cv.placing{cursor:crosshair}
#cvvig{position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse farthest-corner at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,var(--vig, .55)) 100%)}
.panel{background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:14px; box-shadow:inset 0 0 0 1px rgba(233,185,73,.28), 0 6px 18px rgba(0,0,0,.55)}
img.th{display:block; max-width:100%; max-height:100%; object-fit:contain}
img.th.mini{width:24px; height:24px; display:inline-block; vertical-align:middle}
img.ico{width:26px; height:26px; object-fit:contain; flex:none}
.hint{font-size:12.5px; color:var(--cream-2)}
.no{color:#ff8a7a}

/* ---------- haut ---------- */
.hud-top{position:absolute; top:var(--gt); left:var(--gl); right:var(--gr); display:flex; align-items:flex-start; gap:10px 14px; flex-wrap:wrap; pointer-events:none; z-index:5}
.hud-top > *{pointer-events:auto}
.brand{display:flex; flex-direction:column; line-height:.82; transform:rotate(-3deg); user-select:none; margin-right:2px}
.brand .small{font-family:var(--f-hand); font-size:17px; color:var(--cream); margin-left:3px}
.brand .big{font-family:var(--f-display); font-weight:900; font-size:38px; color:var(--red);
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),4px 0 0 var(--edge),-4px 0 0 var(--edge),0 4px 0 var(--edge),0 -4px 0 var(--edge),3px 3px 0 var(--edge),-3px -3px 0 var(--edge),3px -3px 0 var(--edge),-3px 3px 0 var(--edge),0 8px 10px rgba(0,0,0,.7)}
.castle{display:flex; flex-direction:column; padding:6px 12px; min-width:0}
.castle b{font-family:var(--f-display); font-size:19px; color:var(--gold); line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.castle small{color:var(--cream-2); font-size:12px}
.resbar{display:flex; flex-wrap:wrap; gap:2px 4px; padding:5px 8px; flex:1 1 420px; min-width:0}
.res{display:flex; align-items:center; gap:6px; padding:2px 8px 2px 4px; border-radius:10px}
.res b{display:block; font-family:var(--f-display); font-size:21px; line-height:1; color:var(--cream)}
.res small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); line-height:1}
.res.warn{background:rgba(200,65,58,.35)}
.res.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.dials{display:flex; gap:8px}
.dial{display:flex; align-items:center; gap:7px; padding:4px 11px 4px 4px; background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.55)}
.dial small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); font-weight:700}
.dial b{font-family:var(--f-display); font-size:18px; color:var(--cream)}
.sysbtns{display:flex; gap:6px; margin-left:auto}
.rbtn{width:42px; height:42px; border-radius:50%; border:2px solid var(--bronze); background:radial-gradient(circle at 40% 35%, #4a3626, #1e1410); font-size:18px; box-shadow:0 4px 12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(233,185,73,.3)}
.rbtn:hover{border-color:var(--gold)}
.phases{position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--gt) + 112px); display:flex; gap:4px; align-items:center; font-size:12px; font-weight:700; z-index:4; pointer-events:none; white-space:nowrap}
.phases span{padding:2px 9px; border-radius:999px; color:var(--cream-2); background:rgba(20,14,10,.6)}
.phases span.on{background:var(--gold); color:var(--ink)}
.phases i{color:var(--cream-2); font-style:normal; opacity:.6}

/* ---------- gauche : portraits ---------- */
.hud-left{position:absolute; left:var(--gl); top:140px; bottom:calc(var(--gb) + 200px); width:76px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:4}
.best{font-size:11.5px; padding:4px 8px; white-space:nowrap}
.portraits{display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden; padding:6px 6px 10px; scrollbar-width:none}
.portraits::-webkit-scrollbar{display:none}
.pt{position:relative; width:60px; height:60px; flex:none; border:0; padding:0; background:none; border-radius:50%}
.pt .ring{display:flex; align-items:flex-end; justify-content:center; width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 50% 30%, #6a5240, #1f1510 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 5px 12px rgba(0,0,0,.7)}
.pt img{width:96%; transform:translateY(16%)}
.pt:hover .ring, .pt.on .ring{box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 16px rgba(255,190,90,.7)}
.pt.away img{filter:grayscale(.9) brightness(.6)}
.pt .mood{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:38px; height:7px; border-radius:4px; border:1.5px solid #140c08; background:#3a2a20}
.pt .mood::after{content:""; position:absolute; inset:0; border-radius:3px; width:var(--w); background:var(--c)}
.pt .m0{--w:6%; --c:#d23a2a} .pt .m1{--w:20%; --c:#e0602f} .pt .m2{--w:40%; --c:#e0a53a} .pt .m3{--w:60%; --c:#d8c94a} .pt .m4{--w:80%; --c:#8ac24a} .pt .m5{--w:100%; --c:#5fd06a}
.pt .st{position:absolute; top:-4px; right:-4px; font-size:14px}

/* ---------- droite : envies, zoom ---------- */
.tracker{position:absolute; right:var(--gr); top:140px; width:270px; padding:8px 10px 10px; z-index:4}
.trackhead{display:flex; justify-content:space-between; width:100%; border:0; background:none; padding:0 0 4px; font-family:var(--f-display); font-size:18px; color:var(--gold); text-align:left}
.trackhead span{font-family:var(--f-body); font-size:12px; color:var(--cream-2)}
.tracker.closed .goals, .tracker.closed .link{display:none}
.goals{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.goals li{display:flex; gap:7px; font-size:13px; align-items:flex-start; padding:5px 7px; border-radius:9px; background:rgba(255,240,210,.05)}
.goals .ck{color:var(--gold)} .goals .rw{margin-left:auto; font-size:11.5px; color:var(--cream-2); text-align:right}
.link{border:0; background:none; color:var(--gold); font-size:12.5px; text-decoration:underline; padding:6px 0 0}
.zoom{position:absolute; right:var(--gr); top:300px; display:flex; flex-direction:column; gap:6px; z-index:4}
.zoom button{width:38px; height:38px; border-radius:10px; border:2px solid var(--bronze-2); background:rgba(26,18,14,.9); font-size:19px; font-weight:700; color:var(--cream)}
.zoom button:hover{border-color:var(--gold)}

/* ---------- bas : construction ---------- */
.hud-bottom{position:absolute; left:var(--gl); right:calc(var(--gr) + 330px); bottom:var(--gb); display:flex; flex-direction:column; gap:8px; z-index:5; pointer-events:none}
.hud-bottom > *{pointer-events:auto}
.handbar{display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:13.5px; align-self:flex-start; max-width:100%}
.handbar .msg{min-width:0}
.handbar .msg.bad{color:#ff9a8a; font-weight:700} .handbar .msg.ok{color:#b8f08a; font-weight:700}
.raidnote{align-self:flex-start; padding:5px 12px; font-family:var(--f-hand); font-size:16px}
.buildbar{display:flex; flex-direction:column; gap:6px; padding:8px; min-width:0}
.tabs{display:flex; gap:4px}
.tabs button{border:1.5px solid var(--bronze-2); background:rgba(0,0,0,.25); border-radius:999px; padding:3px 13px; font-weight:700; font-size:12.5px; color:var(--cream-2)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg, #f2c75a, #c99a3a); color:var(--ink); border-color:#f6d98a}
.sheet{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 6px; scroll-snap-type:x proximity; scrollbar-width:thin; scrollbar-color:var(--bronze) transparent}
.sheet .grp{flex:none; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--f-display); font-size:14px; color:var(--gold); padding:0 2px; text-align:center}
.card{position:relative; flex:none; width:96px; height:116px; display:flex; flex-direction:column; align-items:center; padding:6px 5px 5px; border-radius:12px; scroll-snap-align:start;
  border:2px solid var(--bronze-2); background:radial-gradient(circle at 50% 38%, #4e3a2a, #1e1510 72%); transition:transform .12s, box-shadow .12s, border-color .12s; user-select:none; -webkit-user-select:none}
.card:hover{transform:translateY(-3px); border-color:var(--gold-2)}
.card.sel{border-color:#ffc25a; box-shadow:0 0 0 2px #ff9c3a, 0 0 18px rgba(255,140,40,.75); transform:translateY(-4px)}
.card .pv{height:62px; width:100%; display:flex; align-items:center; justify-content:center}
.card .pv img{max-height:62px}
.card .nm{font-family:var(--f-display); font-size:14px; line-height:1; color:var(--cream); text-align:center; margin-top:3px; overflow-wrap:anywhere}
.card .cost{margin-top:auto; font-size:11px; font-weight:700; color:var(--gold)}
.card .cost.no{color:#ff8a7a}
.card.locked{filter:grayscale(.85) brightness(.7)}
.card .lock{position:absolute; top:4px; left:4px; right:4px; z-index:1; font-size:10px; font-weight:700; background:rgba(10,6,4,.85); color:var(--cream); border-radius:6px; padding:1px 4px; text-align:center}
.card .free{position:absolute; top:-7px; right:-7px; z-index:1; background:var(--moss); color:#122; border:2px solid #142010; border-radius:999px; font-size:11px; font-weight:800; padding:0 6px}
.tip{position:fixed; z-index:30; width:260px; padding:9px 11px; font-size:13px; pointer-events:none; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip b{display:block; font-family:var(--f-display); font-size:18px; color:var(--gold)} .tip p{margin:5px 0 0}

/* ---------- actions ---------- */
.hud-actions{position:absolute; right:var(--gr); bottom:var(--gb); display:flex; align-items:flex-end; gap:10px; z-index:5}
.round{display:flex; flex-direction:column; align-items:center; gap:3px; width:70px; border:0; background:none; padding:0}
.round img{width:62px; height:62px; padding:12px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #5a4430, #1e1410 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 6px 14px rgba(0,0,0,.7); transition:transform .12s}
.round span{font-family:var(--f-display); font-size:14px; color:var(--cream); text-shadow:0 2px 3px #000; white-space:nowrap}
.round:hover img{transform:translateY(-2px); box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 18px rgba(255,190,90,.6)}
.round[aria-pressed="true"] img, .round.on img{box-shadow:0 0 0 3px #ffc25a, 0 0 0 5px #2a1a0e, 0 0 20px rgba(255,150,50,.8)}
.round.night{width:96px}
.round.night img{width:88px; height:88px; padding:16px; background:radial-gradient(circle at 40% 35%, #c84a3a, #5a1410 78%); box-shadow:0 0 0 3px #f2c75a, 0 0 0 6px #2a1a0e, 0 8px 18px rgba(0,0,0,.7), 0 0 24px rgba(255,120,60,.35)}
.round.night span{font-size:16px; color:var(--gold)}
.round:disabled{opacity:.5; cursor:not-allowed}
.busy .card, .busy #btnRaid, .busy #btnTier{pointer-events:none; opacity:.55}
.pill{border:1.5px solid var(--bronze); border-radius:999px; padding:4px 11px; font-weight:700; font-size:12.5px; background:rgba(26,18,14,.92); color:var(--cream)}
.pill:hover{border-color:var(--gold)}

/* ---------- bannières, toasts ---------- */
.banner{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-2deg); z-index:20; background:var(--parch); color:var(--ink); border:3px solid var(--ink); font-family:var(--f-display); font-weight:900; font-size:clamp(24px,4vw,40px); line-height:1; padding:14px 26px; border-radius:14px; text-align:center; max-width:90%;
  box-shadow:0 0 0 5px var(--edge), 0 18px 40px rgba(0,0,0,.6); animation:pop .4s cubic-bezier(.2,1.5,.4,1); pointer-events:none}
.banner small{display:block; font-family:var(--f-hand); font-weight:400; font-size:18px; line-height:1.2; color:var(--ink-soft); margin-top:6px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4) rotate(-12deg)}}
.toasts{position:absolute; top:calc(var(--gt) + 64px); left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(470px, calc(100vw - 32px))}
.toast{padding:8px 14px; font-weight:700; font-size:14px; border-radius:12px; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); box-shadow:0 8px 20px rgba(0,0,0,.6); animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.toast.bad{border-color:var(--red)}
@keyframes tin{from{transform:translateY(-16px) scale(.92); opacity:0}}

/* ---------- fenêtres (parchemin) ---------- */
.backdrop{position:absolute; inset:0; z-index:50; background:rgba(8,5,4,.62); display:flex; align-items:center; justify-content:center; animation:fade .2s; padding:var(--gt) var(--gr) var(--gb) var(--gl)}
@keyframes fade{from{opacity:0}}
.modal{position:relative; width:100%; max-width:600px; max-height:calc(100% - 20px); overflow:auto; padding:20px; color:var(--ink); background:var(--parch); border:3px solid var(--ink); border-radius:18px;
  background-image:radial-gradient(circle at 15% 10%, rgba(255,255,255,.4), transparent 40%), radial-gradient(circle at 90% 95%, rgba(150,100,40,.16), transparent 45%);
  box-shadow:0 0 0 4px var(--gold-2), 0 0 0 7px #2a1a0e, 0 30px 70px rgba(0,0,0,.7); animation:mpop .35s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{max-width:800px}
@keyframes mpop{from{transform:scale(.88) rotate(-2deg); opacity:0}}
.modal h2{font-family:var(--f-display); font-weight:900; font-size:32px; line-height:1; margin:0 0 6px; color:var(--red-2); text-wrap:balance}
.modal h3{font-family:var(--f-display); font-weight:800; font-size:20px; margin:14px 0 6px; color:var(--ink)}
.modal p{margin:6px 0}
.modal .hint{color:var(--ink-soft)}
.modal .no{color:var(--red-2)}
.modal .x{position:absolute; top:12px; right:12px; border:2px solid var(--ink); background:var(--parch-2); border-radius:10px; width:34px; height:34px; font-size:15px; color:var(--ink)}
.mfoot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px}
.cardhead{display:flex; gap:14px; align-items:center; padding-right:30px}
.portrait{width:96px; height:96px; flex:none; border-radius:18px; background:radial-gradient(circle at 50% 40%, #5a4636, #1e1510); border:3px solid var(--gold-2); display:flex; align-items:center; justify-content:center; padding:6px; box-shadow:0 0 0 3px #2a1a0e, 0 6px 14px rgba(0,0,0,.4)}
.portrait.no img{filter:brightness(0) opacity(.35)}
.bubble{position:relative; background:var(--edge); border:2px solid var(--ink); border-radius:16px; padding:8px 13px; margin:14px 0 4px; font-family:var(--f-hand); font-size:18px; line-height:1.25}
.bubble::before{content:""; position:absolute; top:-12px; left:34px; border:10px solid transparent; border-top:0; border-bottom-color:var(--ink)}
.bubble::after{content:""; position:absolute; top:-8px; left:36px; border:8px solid transparent; border-top:0; border-bottom-color:var(--edge)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin-top:8px}
.kv dt{font-weight:700; color:var(--ink-soft)} .kv dd{margin:0}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
.sbtn{border:2px solid var(--ink); border-radius:11px; padding:7px 12px; font-weight:700; font-size:13.5px; background:var(--parch-2); color:var(--ink); box-shadow:0 2px 0 var(--ink); display:inline-flex; align-items:center; gap:5px}
.sbtn:hover{background:var(--parch-3)}
.sbtn.pri{background:var(--gold)} .sbtn.pri:hover{background:#f2c066}
.sbtn.danger{background:#f0bfb2} .sbtn.danger:hover{background:#e8a593}
.sbtn:disabled{opacity:.45; cursor:not-allowed}
select.sel{font:inherit; font-size:13.5px; border-radius:10px; border:2px solid var(--ink); padding:6px 8px; background:var(--edge); color:var(--ink); max-width:100%}
.tag2{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--parch-2); border:1.5px solid var(--parch-3); color:var(--ink-soft); margin:2px 3px 0 0}
.tip .tag2{background:rgba(255,240,210,.08); border-color:var(--bronze-2); color:var(--cream-2)}
.hearts{font-size:11px; letter-spacing:-1px; white-space:nowrap} .hearts .off{opacity:.3}
.flist{display:flex; flex-direction:column; gap:6px}
.frow{display:flex; gap:10px; align-items:center; background:var(--edge); border:2px solid var(--parch-3); border-radius:12px; padding:5px 8px}
.frow img.th{width:46px; height:46px; flex:none}
.frow > span:nth-child(2){flex:1; min-width:0}
.clockrow{display:flex; gap:14px; align-items:center; margin:10px 0}
.clockrow svg{flex:none}
.choices{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px}
.choice{border:2px solid var(--ink); background:var(--edge); color:var(--ink); border-radius:14px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:3px; min-width:0; box-shadow:0 3px 0 var(--ink)}
.choice[aria-pressed="true"]{background:#fff0c0; box-shadow:0 0 0 3px var(--gold), 0 3px 0 var(--ink)}
.choice:disabled{opacity:.45; cursor:not-allowed}
.choice .emo{font-size:28px}
.choice img.th{width:42px; height:46px}
.choice b{font-family:var(--f-display); font-size:18px; line-height:1.05}
.choice span{font-size:12.5px; color:var(--ink-soft)}
.field{display:flex; flex-direction:column; gap:4px; margin:10px 0}
.field label{font-weight:700; font-size:13px}
.field input{font:inherit; border:2px solid var(--ink); border-radius:12px; padding:8px 12px; background:var(--edge); color:var(--ink)}
.team{display:flex; gap:6px; margin:6px 0} .team img.th{width:48px; height:52px}
.dice{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0}
.die{width:56px; height:56px; border-radius:14px; background:var(--edge); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:900; font-size:32px; color:var(--ink)}
.die.roll{animation:shake .12s infinite} .die.best{background:var(--gold)} .die.six{background:#a9d68f}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-3px)}75%{transform:rotate(10deg)}}
.outcome{text-align:center; font-family:var(--f-display); font-weight:900; font-size:28px; color:var(--red-2)}
.odds{text-align:center; font-size:12.5px; color:var(--ink-soft)}
.chron{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:7px}
.chron li{display:flex; gap:10px; align-items:flex-start; background:var(--edge); border:2px solid var(--parch-3); border-radius:12px; padding:7px 11px; font-size:14px; animation:mpop .3s backwards}
.chron li .emo{font-size:15px; flex:none; font-weight:700; color:var(--ink-soft)}
.chron li.good{border-left:6px solid #6fa85f} .chron li.bad{border-left:6px solid var(--red)} .chron li.ev{border-left:6px solid var(--gold)}
.chron .sec{background:none; border:0; padding:6px 2px 0; animation:none; font-family:var(--f-display); font-weight:800; font-size:19px; color:var(--red-2)}
/* la chronique de la nuit : un ciel étoilé, le bilan en pastilles, des rubans par chapitre */
.modal.nchron{max-width:640px; padding:0; border-width:3px}
.nc-sky{position:relative; height:104px; background:linear-gradient(#0d091b, #251b44 62%, #3a2b5c); overflow:hidden; border-bottom:3px solid var(--ink)}
.nc-sky i{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff6d8; box-shadow:0 0 6px #fff3c0; animation:ncTw 3.2s ease-in-out infinite}
@keyframes ncTw{50%{opacity:.2; transform:scale(.6)}}
.nc-moon{position:absolute; right:13%; top:14px; width:40px; height:40px; border-radius:50%; box-shadow:inset 11px -5px 0 0 #f7e6a6; filter:drop-shadow(0 0 10px rgba(255,234,160,.7)); transform:rotate(-20deg)}
.nc-sky svg{position:absolute; left:0; right:0; bottom:0; width:100%; height:52px; display:block}
.nc-head{position:relative; margin:-30px 18px 0; padding:9px 16px 11px; background:var(--edge); border:3px solid var(--ink); border-radius:16px; text-align:center; box-shadow:0 5px 0 rgba(42,28,22,.18); animation:mpop .35s backwards}
.nc-head small{display:block; font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:11px; color:var(--ink-soft)}
.modal .nc-head h2{margin:2px 0 3px; font-size:40px}
.nc-head p{margin:0; font-size:13px; color:var(--ink-soft)}
.nc-sum{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; padding:14px 14px 0}
.nc-chip{display:inline-grid; grid-template-columns:auto auto; grid-template-areas:'i v' 'i d' 'l l'; align-items:center; column-gap:5px; padding:5px 10px 4px; border-radius:13px; background:var(--edge); border:2px solid var(--parch-3); min-width:78px; box-shadow:0 2px 0 rgba(42,28,22,.1); animation:mpop .35s backwards}
.nc-chip .gi{grid-area:i; width:28px; height:28px} .nc-chip b{grid-area:v; font-size:17px; line-height:1} .nc-chip small{grid-area:d; font-weight:900; font-size:11.5px; line-height:1.2}
.nc-chip em{grid-area:l; font-style:normal; font-size:10.5px; color:var(--ink-soft); text-align:center; margin-top:1px}
.nc-chip.up{border-color:#9fcf8c; background:#f4fbec} .nc-chip.up small{color:#3a8530} .nc-chip.down{border-color:#e3a497; background:#fff2ee} .nc-chip.down small{color:var(--red-2)} .nc-chip.eq small{color:var(--ink-soft)}
.nc-body{padding:2px 18px 4px}
.nc-sec{margin-top:12px}
.modal h3.nc-rib{position:relative; display:inline-flex; align-items:center; gap:7px; margin:4px 0 6px -21px; padding:5px 18px 5px 20px; background:linear-gradient(#b8443c, var(--red-2)); color:#fff3dc; font-size:17px; border-radius:0 10px 10px 0; box-shadow:0 3px 0 rgba(42,28,22,.22)}
.nc-rib::before{content:''; position:absolute; left:0; bottom:-7px; border-style:solid; border-width:0 7px 7px 0; border-color:transparent #5a1612 transparent transparent}
.nc-rib .gi{width:26px; height:26px; margin:-4px 0; filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.nchron .chron{margin-top:2px}
.nchron .chron li{align-items:center; background:var(--edge); border-width:2px; box-shadow:0 2px 0 rgba(42,28,22,.08)}
.nchron .chron li .emo{flex:none; width:34px; height:34px; display:grid; place-items:center; background:#fff; border-radius:50%; box-shadow:0 0 0 2px var(--parch-3), 0 2px 4px rgba(0,0,0,.18)}
.nchron .chron li:nth-child(odd) .emo{transform:rotate(-7deg)} .nchron .chron li:nth-child(even) .emo{transform:rotate(6deg)}
.nchron .chron li .emo .gi{width:26px; height:26px}
.nchron .mfoot.nc-foot{position:sticky; bottom:0; justify-content:center; margin:6px 0 0; padding:18px 16px 14px; background:linear-gradient(rgba(243,230,200,0), var(--parch) 45%)}
.nc-go{font-size:18px; padding:10px 28px} .nc-go .gi{width:26px; height:26px; vertical-align:-6px}
@media (max-width:520px){ .modal .nc-head h2{font-size:32px} .nc-chip{min-width:0; padding:4px 7px} .nc-chip .gi{width:22px; height:22px} .nc-body{padding:2px 12px 4px} .modal h3.nc-rib{margin-left:-15px} }
@media (prefers-reduced-motion: reduce){ .nc-sky i, .nc-chip, .nc-head{animation:none} }
.req{list-style:none; padding:0; margin:8px 0; display:flex; flex-direction:column; gap:5px}
.help li, .help p{font-size:14px} .help ul{padding-left:20px; margin:6px 0}
.modal .clist{display:flex; flex-direction:column; gap:6px; max-height:300px; overflow:auto; padding:2px}
.crow{display:flex; align-items:center; gap:9px; border:2px solid var(--ink); background:var(--edge); color:var(--ink); border-radius:12px; padding:4px 9px 4px 5px; text-align:left; box-shadow:0 2px 0 var(--ink)}
.crow img.th{width:38px; height:42px; flex:none}
.crow .who{flex:1; min-width:0; line-height:1.15} .crow .who b{font-family:var(--f-display); font-size:17px; display:block} .crow .who span{font-size:11.5px; color:var(--ink-soft)}
.album{display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:8px}
.album .s{aspect-ratio:1; border-radius:12px; background:radial-gradient(circle at 50% 40%, #5a4636, #1e1510); border:2px solid var(--gold-2); padding:4px; display:flex; align-items:center; justify-content:center}

/* ---------- Atelier du Maître (administration) ---------- */

.adm-head{grid-column:1/-1; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--bronze-2); background:rgba(0,0,0,.25)}

.spc img{height:58px; max-width:100%; object-fit:contain} .spc b{font-family:var(--f-display); font-size:13.5px; line-height:1; text-align:center} .spc small{font-size:10.5px; color:var(--cream-2); text-align:center; overflow-wrap:anywhere}

.prevbox{display:flex; flex-direction:column; gap:6px; max-width:540px}
canvas.prev{display:block; width:100%; height:250px; border-radius:12px; border:1.5px solid var(--bronze-2)}
.prevctl{display:flex; gap:4px; flex-wrap:wrap}
.afgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px 10px}

.adv-box{flex:1; min-width:0; padding:12px 14px 12px 26px; border-radius:16px; background:var(--parch); color:var(--ink); border:3px solid var(--ink); box-shadow:0 0 0 3px var(--gold-2), 0 14px 30px rgba(0,0,0,.6)}

.adv-head b{font-family:var(--f-display); font-size:20px; color:var(--red-2); line-height:1.05} .adv-head small{font-size:11.5px; color:var(--ink-soft); font-weight:700}
.adv-text{margin:6px 0 8px; font-size:14px; line-height:1.4}
.adv-btns{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.adv-btns .link{color:var(--ink-soft); font-size:12px; margin-left:auto; padding:0}
.advisor.tip .adv-box{box-shadow:0 0 0 3px var(--blue), 0 14px 30px rgba(0,0,0,.6)}
.tuto-glow{position:relative; animation:tglow 1.1s ease-in-out infinite; z-index:6}
@keyframes tglow{0%,100%{box-shadow:0 0 0 3px #ffb347, 0 0 14px 4px rgba(255,150,40,.6)}50%{box-shadow:0 0 0 5px #ffd27a, 0 0 26px 10px rgba(255,170,60,.85)}}
.res, .dial{cursor:pointer}
@media (max-width:900px){ .advisor{left:var(--gl); right:var(--gr); width:auto; bottom:calc(var(--gb) + 282px)} .adv-pic{width:62px; height:62px} }
@media (max-width:700px){ .grim{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)} #gcats{max-height:30vh} .wfig{width:84px; height:84px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important} }

/* invasion : la bande, la tactique, l'accélération */
.hcards{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.hcard{flex:1 1 130px; max-width:190px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px; border-radius:14px; background:var(--edge); border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); text-align:center}
.hcard img.th{width:52px; height:56px}
.hcard b{font-family:var(--f-display); font-size:17px; line-height:1.05}
.hcard .hst{font-weight:800; color:var(--red-2)}
.hcard small{font-size:12.5px; color:var(--ink-soft); line-height:1.25}
.tactics{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.tactic{cursor:pointer; font:inherit}

.tactic small{color:var(--ink-soft); font-size:13px; line-height:1.25}
.addlist{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; margin-top:6px}
.addrow{display:flex; flex-direction:column; gap:4px; padding:9px 10px; border-radius:12px; background:var(--edge); border:2px solid var(--parch-3); box-shadow:0 2px 0 rgba(0,0,0,.08)}
.addrow.off{opacity:.55; filter:grayscale(.75)}
.arhead{display:flex; align-items:center; gap:7px} .arhead img{width:34px; height:34px; flex:none} .arhead b{flex:1; line-height:1.1}
.arcost{font-weight:800; white-space:nowrap; font-size:13px} .arcost.no{color:var(--red-2)}
.arfree{font-weight:800; white-space:nowrap; font-size:12px; color:#245e22; background:#dcefcf; border-radius:999px; padding:1px 8px 1px 4px; box-shadow:0 0 0 1px rgba(36,94,34,.3)} .arfree .gi{width:16px; height:16px; vertical-align:-3px}
.artags{min-height:0} .ardesc{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.25}
.arwhy{margin:0; font-size:12.5px; font-weight:800; color:var(--red-2)}
.ardet summary{cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-soft)} .ardetb{font-size:12.5px; padding-top:4px} .ardetb .tipl{margin:4px 0 0; padding-left:18px}
.addrow .sbtn{align-self:flex-start; margin-top:2px}
.tactic .odds{display:inline-block; margin-top:4px; font-style:normal; font-weight:700; font-size:12.5px; padding:1px 8px; border-radius:999px; background:rgba(0,0,0,.08)}
.tactic .odds.good{color:#2f7a2a; background:rgba(80,170,60,.14)} .tactic .odds.mid{color:#9a6a12; background:rgba(230,170,40,.16)} .tactic .odds.bad{color:#b0321f; background:rgba(220,70,40,.14)}
.invfast{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--gb, 0px) + 110px); z-index:40}
/* petits stickers d'état (portraits et Grimoire) */
.pt .stk, .stk.inl{display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:50%; border:2px solid #fbf3e0; box-shadow:0 2px 4px rgba(0,0,0,.45); color:#fff; font:900 12px Georgia, serif; line-height:1}
.pt .stk{position:absolute; top:-6px; right:-6px; z-index:2}
.stk.inl{vertical-align:middle; margin-right:6px}
.stk .gi{width:15px; height:15px; vertical-align:middle; filter:none}
.ival{display:grid; grid-template-columns:minmax(0, 340px) 1fr; gap:14px; align-items:center; margin:4px 0 10px}
#iVal{width:100%; aspect-ratio:1.18; display:block; border-radius:14px; background:#16121c; box-shadow:0 0 0 2px rgba(42,28,22,.7), 0 6px 16px rgba(0,0,0,.35)}
.ivaltxt p{margin:0 0 8px} .iseed{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:13px} .iseed input{width:84px; padding:4px 8px; border-radius:8px; border:2px solid rgba(42,28,22,.5); font:inherit}

@media (prefers-reduced-motion: reduce){.pt .stk.bob, .pt .stk.shake{animation:none}}

/* le blason du rival, en haut */
.trival{display:flex; align-items:center; gap:6px; height:34px; padding:0 10px 0 6px; border-radius:17px; border:2px solid var(--bronze); background:rgba(20,12,10,.75); color:var(--cream); cursor:pointer; font:inherit; flex:none}
.trival .rvemo{font-size:18px; line-height:1}
.trival .rvbar{position:relative; width:46px; height:8px; border-radius:4px; background:#7a2a2a; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.trival .rvbar i{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, #e9b949, #f5d27a); border-radius:4px}
.trival .rvwarn{font-size:14px}
.trival.alert{border-color:var(--red); animation:rvpulse 1.2s ease-in-out infinite}
@keyframes rvpulse{50%{box-shadow:0 0 0 4px rgba(200,65,58,.45)}}
@media (prefers-reduced-motion: reduce){.trival.alert{animation:none}}
@media (max-width: 720px){.trival .rvbar{width:28px}}
.portrait.rv{display:flex; align-items:center; justify-content:center; font-size:56px; line-height:1}
.duels{display:flex; flex-direction:column; gap:8px; margin:10px 0}
.duel{display:grid; grid-template-columns:minmax(90px,1.2fr) 34px minmax(80px,2fr) 34px; align-items:center; gap:8px}
.duel .dl{font-weight:700}
.duel .num{text-align:center}
.duel .dbar{position:relative; height:10px; border-radius:5px; background:#b8483e; overflow:hidden; border:1.5px solid var(--ink)}
.duel .dbar i{position:absolute; left:0; top:0; bottom:0; background:var(--gold)}
.duel small{grid-column:1 / -1; color:var(--ink-soft); font-size:12.5px; margin-top:-4px}
.duel.head b{text-align:center; font-family:var(--f-display)}

/* intrigues */
.saga{margin:8px 0; padding:10px 12px; border-radius:14px; border:2px solid #7a4bd1; background:#f1e8ff; box-shadow:0 3px 0 #4a2a7a}
.saga b{font-family:var(--f-display); font-size:17px}
.saga p{margin:6px 0}
.saga.offer{background:#fff3d6; border-color:var(--gold-2); box-shadow:0 3px 0 var(--bronze-2)}
.saga.done{background:#fff6d0; border-color:var(--gold)}
.saga .btnrow{display:flex; flex-wrap:wrap; gap:8px}
.saga .btnrow small{font-weight:400; opacity:.85}

.linkbtn{border:0; background:none; padding:0; color:var(--red-2); text-decoration:underline; cursor:pointer; font:inherit}

/* raids : pousser, pacte */
.raidx{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin:8px 0}
.raidx .rx{cursor:pointer; font:inherit}
.raidx .rx span{color:var(--ink-soft); font-size:13px}

/* factions et territoires */
.facs{display:flex; flex-direction:column; gap:10px; margin:10px 0}
.facrow{display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--edge); border:2px solid var(--ink)}
.fclock{flex:none}
.hcard.foe{border-color:var(--red); box-shadow:0 3px 0 var(--red-2)}

/* invasion : le but de la bande, les pouvoirs du Cœur */
.goalline{padding:8px 12px; border-radius:12px; background:#fff0c0; border:2px solid var(--gold-2)}
.powbar{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--gb, 0px) + 150px); z-index:45; width:min(760px, calc(100% - 32px)); padding:10px 12px; border-radius:16px; background:var(--parch); color:var(--ink); border:3px solid var(--ink); box-shadow:0 6px 0 rgba(0,0,0,.35)}
/* chantiers, cuisine, caravanes, saison */
.chsec .addrow.done{opacity:.75} .chsec h3 .gi, .cvsec h3 .gi{width:24px; height:24px; vertical-align:-5px}
.pantry{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px} .pantry .gi{width:20px; height:20px; vertical-align:-5px}
#turn .season{display:block; font-size:11px; opacity:.9; white-space:nowrap} #turn .season .gi{width:14px; height:14px; vertical-align:-3px}
/* le mode « Gardes » */
.guardhud{position:absolute; left:84px; right:12px; top:calc(var(--gt, 0px) + 74px); z-index:44; max-width:620px; margin-left:auto; padding:10px 14px; border-radius:16px; background:var(--parch); color:var(--ink); border:3px solid var(--ink); box-shadow:0 6px 18px rgba(0,0,0,.45)}
.guardhud .gh-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap} .guardhud .gh-top b{flex:1; font-family:var(--f-display); font-size:20px; color:var(--red-2)} .guardhud .gh-top .gi{width:26px; height:26px; vertical-align:-6px}
.guardhud .gh-n{display:inline-block; margin-left:6px; padding:0 9px; border-radius:999px; background:#e9b949; color:var(--ink); font-size:16px} .guardhud .gh-n.full{background:var(--red-2); color:#fff}
.guardhud p{margin:6px 0 0; font-size:13.5px}
body.guarding #portraits .pt{cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none} body.guarding #portraits .pt img{-webkit-user-drag:none; user-drag:none; pointer-events:none} body.guarding #portraits .pt.gsel .ring{box-shadow:0 0 0 3px #7ee08a, 0 0 14px #7ee08a}
body.guarding #portraits{outline:3px dashed rgba(233,185,73,.7); outline-offset:3px; border-radius:16px}
#portraits .pt .gbadge{position:absolute; left:-4px; bottom:-2px; width:20px; height:20px; display:grid; place-items:center; border-radius:50%; background:#fffdf5; box-shadow:0 0 0 2px var(--ink)} #portraits .pt .gbadge .gi{width:16px; height:16px}
.gghost{position:fixed; z-index:200; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:#3a2a24; box-shadow:0 0 0 4px #fffdf5, 0 8px 18px rgba(0,0,0,.5); overflow:hidden; pointer-events:none; transform:rotate(-6deg); opacity:.92} .gghost img{width:100%; height:100%; object-fit:cover} .gghost.ok{box-shadow:0 0 0 4px #7ee08a, 0 8px 18px rgba(0,0,0,.5)}
#btnGuards.on{box-shadow:0 0 0 3px #e9b949, 0 0 16px #e9b949}
.gsec .gi{width:22px; height:22px; vertical-align:-5px}
/* l'artisanat et la renommée */
.craftlist{list-style:none; margin:6px 0; padding:0; display:grid; gap:4px}
.craftlist li{padding:5px 9px; border-radius:10px; background:var(--edge); border:1.5px solid var(--parch-3)}
.craftlist li.off{opacity:.6}
.famelist{display:grid; gap:6px; margin:6px 0 10px}
.famerow{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:var(--edge); border:2px solid var(--parch-3); box-shadow:0 2px 0 rgba(0,0,0,.08)}
.famerow > .gi{width:28px; height:28px; flex:none}
.famerow span{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.25}
.famerow small{opacity:.78}
.famerow em{font-style:normal; font-weight:800; white-space:nowrap; color:#5a3a08; background:#f6d77e; border:1.5px solid #fffdf5; border-radius:999px; padding:2px 9px; box-shadow:0 1px 0 rgba(0,0,0,.15)}
.fbar{display:block; height:6px; border-radius:4px; background:rgba(60,40,30,.12); overflow:hidden; margin-top:2px}
.fbar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#e9b949,#f3d27a)}
.famegot{display:flex; flex-wrap:wrap; gap:5px}
/* le journal des quêtes */
.qjournal{display:grid; gap:12px}
.qcard{position:relative; padding:12px 14px 10px; border-radius:16px; background:var(--edge); border:2px solid var(--parch-3); box-shadow:0 3px 0 rgba(0,0,0,.1)}
.qcard.main{border-color:#d9a93a; background:linear-gradient(180deg, rgba(246,215,126,.28), transparent 70%), var(--edge)}
.qcard header{display:flex; gap:10px; align-items:center}
.qcard .qico{width:44px; height:44px; flex:none; border-radius:50%; background:var(--parch); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center}
.qcard .qico .gi{width:30px; height:30px}
.qcard h3{margin:0; font-family:var(--f-display); font-size:19px; line-height:1.15}
.qcard header small{opacity:.8}
.qcard footer{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1.5px dashed var(--parch-3)}
.qcard footer .btnrow{margin:0}
.qstory{font-family:"Patrick Hand", cursive; font-size:16.5px; line-height:1.35; margin:6px 0; padding:6px 10px; border-left:3px solid #d9a93a; background:rgba(255,253,245,.55); border-radius:0 10px 10px 0}
.qsteps{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:6px}
.qsteps li{display:flex; gap:10px; align-items:flex-start}
.qsteps li > div{flex:1; min-width:0}
.qsteps li p{margin:3px 0}
.qsteps .qn{width:26px; height:26px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; border:2px solid var(--ink); background:var(--parch)}
.qsteps .qn .gi{width:18px; height:18px}
.qsteps li.done{opacity:.8} .qsteps li.done .qn{background:#bfe3a0; border-color:#3d6a22} .qsteps li.done b{color:#3d6a22}
.qsteps li.done p{font-size:13px; opacity:.85}
.qsteps li.cur{padding:8px; border-radius:12px; background:rgba(255,253,245,.7); border:2px solid #d9a93a}
.qsteps li.cur .qn{background:#f6d77e}
.qsteps li.todo{opacity:.5}
.qitems{list-style:none; margin:6px 0; padding:0; display:grid; gap:6px}
.qitems li{display:flex; gap:8px; align-items:center}
.qitems li > .gi{width:24px; height:24px; flex:none}
.qitems li > span{flex:1; min-width:0}
.qenv{margin:4px 0 10px; padding-left:18px} .qenv li[data-qcrit]{cursor:pointer}
.qdone{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.qdone li{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:12px; background:var(--edge); border:1.5px solid var(--parch-3)}
.qdone li > .gi{width:26px; height:26px; flex:none} .qdone li.off{opacity:.55} .qdone p{margin:3px 0 0; font-size:13.5px}
.mini{position:relative} .qbadge{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 4px; border-radius:999px; background:#c8413a; color:#fff; font:800 11px/18px Andika, sans-serif; border:2px solid #fffdf5; text-align:center; pointer-events:none}
.sbtn.small{padding:4px 10px; font-size:12px}
/* le téléphone : pas de zoom au double toucher sur les boutons, pas de flash gris, et la barre du bas ne bloque le château qu'à ses boutons */
button, .card, .pt, .choice, .sbtn, .mini, .act, .res, .dial, [role=button]{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
#cv, #wcv{-webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
.hud-actions, .hud-actions .acts{pointer-events:none} .hud-actions > *, .hud-actions .acts > *{pointer-events:auto}
/* le rêve secret d'une créature (sa fiche) */
.modal p.secret{margin:8px 0; padding:8px 11px; border-radius:12px; background:rgba(122,75,209,.08); border:1.5px dashed #7a4bd1}
.actbar{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--gb, 0px) + 96px); z-index:44; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; padding:8px 12px; border-radius:22px; background:var(--parch); color:var(--ink); border:3px solid var(--ink); box-shadow:0 6px 18px rgba(0,0,0,.45); width:max-content; max-width:calc(100% - 24px)}
.actbar .ab-tok{display:inline-flex; align-items:center; gap:3px; font-weight:900; font-size:18px} .actbar .ab-tok .gi{width:26px; height:26px}
.actbar .ab{padding:6px 12px; font-size:14px; white-space:nowrap} .actbar .ab small{font-weight:700; opacity:.8}
.tactic .odds + .odds{margin-top:2px}
.powbar .pwhead{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; margin-bottom:8px}
.powbar .pwhead b{font-family:var(--f-display); font-size:19px; color:var(--red-2)}
.powbar .pwbtns{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.powbar .pw{cursor:pointer; font:inherit; padding:8px}
.powbar .pw .emo{font-size:22px}
.powbar .pw small{color:var(--ink-soft); font-size:12px; line-height:1.2}
.powbar .pwgo{align-self:stretch}
@media (max-width: 720px){.powbar{bottom:calc(var(--gb, 0px) + 120px)} .powbar .pw small{display:none}}

/* expéditions dans les donjons */
.cpage{position:fixed; inset:0; z-index:85; display:flex; flex-direction:column; color:var(--cream); background:var(--c2); overflow:hidden; --c1:#2a2238; --c2:#0b0910; --acc:#ffd36a; --wall:#1a1424}
.cpage.intro{animation:cpIn .35s ease-out} .cpage.out{animation:cpOut .25s ease-in forwards}
@keyframes cpIn{from{opacity:0; transform:scale(1.03)}} @keyframes cpOut{to{opacity:0; transform:scale(.98)}}
.cpage.theme-morgrave{--c1:#20393a; --c2:#081011; --acc:#86e0d4; --wall:#11201f} .cpage.theme-septbieres{--c1:#4a2c14; --c2:#140b05; --acc:#f6b85a; --wall:#2b1a0d}
.cpage.theme-moussues{--c1:#22402a; --c2:#08120a; --acc:#a6e88a; --wall:#0f2214} .cpage.theme-ombrelune{--c1:#33204a; --c2:#0c0714; --acc:#cfa8ff; --wall:#1d1230}
.cpage.theme-ruines{--c1:#3b3226; --c2:#0e0b08; --acc:#f2d48a; --wall:#1d1812} .cpage.theme-foret{--c1:#17482c; --c2:#06140b; --acc:#c4f5a6; --wall:#0c2716} .cpage.theme-grotte{--c1:#1f2a3e; --c2:#070a12; --acc:#a6d4ff; --wall:#111a2a}
.cpage.quake{animation:quake .35s} .cpage.quake2{animation:quake2 .45s}
@keyframes quake{20%{transform:translate(-4px,2px)} 40%{transform:translate(4px,-2px)} 60%{transform:translate(-3px,1px)} 80%{transform:translate(2px,-1px)}}
@keyframes quake2{15%{transform:translate(-9px,4px)} 30%{transform:translate(8px,-5px)} 45%{transform:translate(-6px,3px)} 60%{transform:translate(5px,-2px)} 80%{transform:translate(-2px,1px)}}
/* le décor */
.cdecor{position:absolute; inset:0; z-index:0; overflow:hidden; background:radial-gradient(120% 80% at 50% 28%, var(--c1), var(--c2) 72%); transition:filter .6s, opacity .6s; filter:brightness(.55) saturate(.8)}
.cpage.battle .cdecor{filter:none}
.dsky{position:absolute; inset:0 0 34% 0} .dsky svg{width:100%; height:100%; display:block}
.dfloor{position:absolute; left:-10%; right:-10%; bottom:0; height:40%; background:linear-gradient(var(--wall), var(--c2)); box-shadow:0 -1px 0 rgba(255,255,255,.06)}
/* en combat, la ligne du fond suit les pieds des figurines (--hz, posé par le jeu) */
.dfloor, .dsky{transition:height .5s ease, bottom .5s ease} .dprop.l1, .dlight{transition:bottom .5s ease}
.cpage.battle .dfloor{height:var(--hz, 40%)} .cpage.battle .dsky{bottom:calc(var(--hz, 40%) - 30px)}
.cpage.battle .dprop.l1{bottom:calc(var(--hz, 46%) + var(--pb, 0px)) !important} .cpage.battle .dlight{bottom:calc(var(--hz, 46%) + min(15vh, 96px)) !important}
.dfloor::before{content:''; position:absolute; inset:0; opacity:.22; background:repeating-linear-gradient(90deg, transparent 0 58px, rgba(0,0,0,.6) 58px 61px), repeating-linear-gradient(0deg, transparent 0 26px, rgba(0,0,0,.5) 26px 28px); transform:perspective(380px) rotateX(58deg); transform-origin:50% 0}

/* l'arène */
