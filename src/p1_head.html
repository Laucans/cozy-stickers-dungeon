<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Stickers Dungeon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grenze+Gotisch:wght@600;800;900&family=Patrick+Hand&display=swap">
<style>
/* Mise en page : jeu plein écran — le château éclairé à la torche occupe tout le fond, l'interface flotte par-dessus en panneaux de cuir sombre cerclés de bronze (haut : ressources ; gauche : portraits ; bas : construction ; droite : envies et actions). Univers visuel unique et assumé. */
:root{
  --night:#0b0910; --leather:#1f1611; --leather-2:#2b1f17; --bronze:#8a6338; --bronze-2:#5a4028; --gold:#e9b949; --gold-2:#c99a4a;
  --cream:#f3e3c0; --cream-2:#cdb995; --ink:#2a1c16; --red:#c8413a; --red-2:#a0302b; --moss:#7fbf5a; --blue:#5a86d0;
  --parch:#f3e6c8; --parch-2:#e8d6b0; --parch-3:#d2ba8c; --ink-soft:#6e5444; --edge:#fffdf5;
  --f-display:"Grenze Gotisch",Georgia,serif; --f-body:"Andika","Segoe UI",system-ui,sans-serif; --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px)); --gt:max(10px, env(safe-area-inset-top, 0px)); --gb:max(10px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--night); color:var(--cream); font-family:var(--f-body); font-size:14px; line-height:1.35; overflow:hidden; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; line-height:1}
.num{font-variant-numeric:tabular-nums}
#game{position:fixed; inset:0; overflow:hidden}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#cv.placing{cursor:crosshair}
.panel{background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:14px; box-shadow:inset 0 0 0 1px rgba(233,185,73,.28), 0 6px 18px rgba(0,0,0,.55)}
img.th{display:block; max-width:100%; max-height:100%; object-fit:contain}
img.th.mini{width:24px; height:24px; display:inline-block; vertical-align:middle}
img.ico{width:26px; height:26px; object-fit:contain; flex:none}
.hint{font-size:12.5px; color:var(--cream-2)}
.no{color:#ff8a7a}

/* ---------- haut ---------- */
.hud-top{position:absolute; top:var(--gt); left:var(--gl); right:var(--gr); display:flex; align-items:flex-start; gap:10px 14px; flex-wrap:wrap; pointer-events:none; z-index:5}
.hud-top > *{pointer-events:auto}
.brand{display:flex; flex-direction:column; line-height:.82; transform:rotate(-3deg); user-select:none; margin-right:2px}
.brand .small{font-family:var(--f-hand); font-size:17px; color:var(--cream); margin-left:3px}
.brand .big{font-family:var(--f-display); font-weight:900; font-size:38px; color:var(--red);
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),4px 0 0 var(--edge),-4px 0 0 var(--edge),0 4px 0 var(--edge),0 -4px 0 var(--edge),3px 3px 0 var(--edge),-3px -3px 0 var(--edge),3px -3px 0 var(--edge),-3px 3px 0 var(--edge),0 8px 10px rgba(0,0,0,.7)}
.castle{display:flex; flex-direction:column; padding:6px 12px; min-width:0}
.castle b{font-family:var(--f-display); font-size:19px; color:var(--gold); line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.castle small{color:var(--cream-2); font-size:12px}
.resbar{display:flex; flex-wrap:wrap; gap:2px 4px; padding:5px 8px; flex:1 1 420px; min-width:0}
.res{display:flex; align-items:center; gap:6px; padding:2px 8px 2px 4px; border-radius:10px}
.res b{display:block; font-family:var(--f-display); font-size:21px; line-height:1; color:var(--cream)}
.res small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); line-height:1}
.res.warn{background:rgba(200,65,58,.35)}
.res.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.dials{display:flex; gap:8px}
.dial{display:flex; align-items:center; gap:7px; padding:4px 11px 4px 4px; background:linear-gradient(180deg, rgba(43,31,23,.94), rgba(26,18,14,.94)); border:2px solid var(--bronze-2); border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.55)}
.dial small{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--cream-2); font-weight:700}
.dial b{font-family:var(--f-display); font-size:18px; color:var(--cream)}
.sysbtns{display:flex; gap:6px; margin-left:auto}
.rbtn{width:42px; height:42px; border-radius:50%; border:2px solid var(--bronze); background:radial-gradient(circle at 40% 35%, #4a3626, #1e1410); font-size:18px; box-shadow:0 4px 12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(233,185,73,.3)}
.rbtn:hover{border-color:var(--gold)}
.phases{position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--gt) + 112px); display:flex; gap:4px; align-items:center; font-size:12px; font-weight:700; z-index:4; pointer-events:none; white-space:nowrap}
.phases span{padding:2px 9px; border-radius:999px; color:var(--cream-2); background:rgba(20,14,10,.6)}
.phases span.on{background:var(--gold); color:var(--ink)}
.phases i{color:var(--cream-2); font-style:normal; opacity:.6}

/* ---------- gauche : portraits ---------- */
.hud-left{position:absolute; left:var(--gl); top:140px; bottom:calc(var(--gb) + 200px); width:76px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:4}
.best{font-size:11.5px; padding:4px 8px; white-space:nowrap}
.portraits{display:flex; flex-direction:column; gap:12px; overflow-y:auto; overflow-x:hidden; padding:6px 6px 10px; scrollbar-width:none}
.portraits::-webkit-scrollbar{display:none}
.pt{position:relative; width:60px; height:60px; flex:none; border:0; padding:0; background:none; border-radius:50%}
.pt .ring{display:flex; align-items:flex-end; justify-content:center; width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 50% 30%, #6a5240, #1f1510 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 5px 12px rgba(0,0,0,.7)}
.pt img{width:96%; transform:translateY(16%)}
.pt:hover .ring, .pt.on .ring{box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 16px rgba(255,190,90,.7)}
.pt.away img{filter:grayscale(.9) brightness(.6)}
.pt .mood{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:38px; height:7px; border-radius:4px; border:1.5px solid #140c08; background:#3a2a20}
.pt .mood::after{content:""; position:absolute; inset:0; border-radius:3px; width:var(--w); background:var(--c)}
.pt .m0{--w:6%; --c:#d23a2a} .pt .m1{--w:20%; --c:#e0602f} .pt .m2{--w:40%; --c:#e0a53a} .pt .m3{--w:60%; --c:#d8c94a} .pt .m4{--w:80%; --c:#8ac24a} .pt .m5{--w:100%; --c:#5fd06a}
.pt .st{position:absolute; top:-4px; right:-4px; font-size:14px}

/* ---------- droite : envies, zoom ---------- */
.tracker{position:absolute; right:var(--gr); top:140px; width:270px; padding:8px 10px 10px; z-index:4}
.trackhead{display:flex; justify-content:space-between; width:100%; border:0; background:none; padding:0 0 4px; font-family:var(--f-display); font-size:18px; color:var(--gold); text-align:left}
.trackhead span{font-family:var(--f-body); font-size:12px; color:var(--cream-2)}
.tracker.closed .goals, .tracker.closed .link{display:none}
.goals{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.goals li{display:flex; gap:7px; font-size:13px; align-items:flex-start; padding:5px 7px; border-radius:9px; background:rgba(255,240,210,.05)}
.goals .ck{color:var(--gold)} .goals .rw{margin-left:auto; font-size:11.5px; color:var(--cream-2); text-align:right}
.link{border:0; background:none; color:var(--gold); font-size:12.5px; text-decoration:underline; padding:6px 0 0}
.zoom{position:absolute; right:var(--gr); top:300px; display:flex; flex-direction:column; gap:6px; z-index:4}
.zoom button{width:38px; height:38px; border-radius:10px; border:2px solid var(--bronze-2); background:rgba(26,18,14,.9); font-size:19px; font-weight:700; color:var(--cream)}
.zoom button:hover{border-color:var(--gold)}

/* ---------- bas : construction ---------- */
.hud-bottom{position:absolute; left:var(--gl); right:calc(var(--gr) + 330px); bottom:var(--gb); display:flex; flex-direction:column; gap:8px; z-index:5; pointer-events:none}
.hud-bottom > *{pointer-events:auto}
.handbar{display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:13.5px; align-self:flex-start; max-width:100%}
.handbar .msg{min-width:0}
.handbar .msg.bad{color:#ff9a8a; font-weight:700} .handbar .msg.ok{color:#b8f08a; font-weight:700}
.raidnote{align-self:flex-start; padding:5px 12px; font-family:var(--f-hand); font-size:16px}
.buildbar{display:flex; flex-direction:column; gap:6px; padding:8px; min-width:0}
.tabs{display:flex; gap:4px}
.tabs button{border:1.5px solid var(--bronze-2); background:rgba(0,0,0,.25); border-radius:999px; padding:3px 13px; font-weight:700; font-size:12.5px; color:var(--cream-2)}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg, #f2c75a, #c99a3a); color:var(--ink); border-color:#f6d98a}
.sheet{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 6px; scroll-snap-type:x proximity; scrollbar-width:thin; scrollbar-color:var(--bronze) transparent}
.sheet .grp{flex:none; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--f-display); font-size:14px; color:var(--gold); padding:0 2px; text-align:center}
.card{position:relative; flex:none; width:96px; height:116px; display:flex; flex-direction:column; align-items:center; padding:6px 5px 5px; border-radius:12px; scroll-snap-align:start;
  border:2px solid var(--bronze-2); background:radial-gradient(circle at 50% 38%, #4e3a2a, #1e1510 72%); transition:transform .12s, box-shadow .12s, border-color .12s; user-select:none; -webkit-user-select:none}
.card:hover{transform:translateY(-3px); border-color:var(--gold-2)}
.card.sel{border-color:#ffc25a; box-shadow:0 0 0 2px #ff9c3a, 0 0 18px rgba(255,140,40,.75); transform:translateY(-4px)}
.card .pv{height:62px; width:100%; display:flex; align-items:center; justify-content:center}
.card .pv img{max-height:62px}
.card .nm{font-family:var(--f-display); font-size:14px; line-height:1; color:var(--cream); text-align:center; margin-top:3px; overflow-wrap:anywhere}
.card .cost{margin-top:auto; font-size:11px; font-weight:700; color:var(--gold)}
.card .cost.no{color:#ff8a7a}
.card.locked{filter:grayscale(.85) brightness(.7)}
.card .lock{position:absolute; top:4px; left:4px; right:4px; z-index:1; font-size:10px; font-weight:700; background:rgba(10,6,4,.85); color:var(--cream); border-radius:6px; padding:1px 4px; text-align:center}
.card .free{position:absolute; top:-7px; right:-7px; z-index:1; background:var(--moss); color:#122; border:2px solid #142010; border-radius:999px; font-size:11px; font-weight:800; padding:0 6px}
.tip{position:fixed; z-index:30; width:260px; padding:9px 11px; font-size:13px; pointer-events:none; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.6)}
.tip b{display:block; font-family:var(--f-display); font-size:18px; color:var(--gold)} .tip p{margin:5px 0 0}

/* ---------- actions ---------- */
.hud-actions{position:absolute; right:var(--gr); bottom:var(--gb); display:flex; align-items:flex-end; gap:10px; z-index:5}
.round{display:flex; flex-direction:column; align-items:center; gap:3px; width:70px; border:0; background:none; padding:0}
.round img{width:62px; height:62px; padding:12px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #5a4430, #1e1410 75%); box-shadow:0 0 0 3px var(--gold-2), 0 0 0 5px #2a1a0e, 0 6px 14px rgba(0,0,0,.7); transition:transform .12s}
.round span{font-family:var(--f-display); font-size:14px; color:var(--cream); text-shadow:0 2px 3px #000; white-space:nowrap}
.round:hover img{transform:translateY(-2px); box-shadow:0 0 0 3px var(--gold), 0 0 0 5px #2a1a0e, 0 0 18px rgba(255,190,90,.6)}
.round[aria-pressed="true"] img, .round.on img{box-shadow:0 0 0 3px #ffc25a, 0 0 0 5px #2a1a0e, 0 0 20px rgba(255,150,50,.8)}
.round.night{width:96px}
.round.night img{width:88px; height:88px; padding:16px; background:radial-gradient(circle at 40% 35%, #c84a3a, #5a1410 78%); box-shadow:0 0 0 3px #f2c75a, 0 0 0 6px #2a1a0e, 0 8px 18px rgba(0,0,0,.7), 0 0 24px rgba(255,120,60,.35)}
.round.night span{font-size:16px; color:var(--gold)}
.round:disabled{opacity:.5; cursor:not-allowed}
.busy .card, .busy #btnRaid, .busy #btnTier{pointer-events:none; opacity:.55}
.pill{border:1.5px solid var(--bronze); border-radius:999px; padding:4px 11px; font-weight:700; font-size:12.5px; background:rgba(26,18,14,.92); color:var(--cream)}
.pill:hover{border-color:var(--gold)}

/* ---------- bannières, toasts ---------- */
.banner{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-2deg); z-index:20; background:var(--parch); color:var(--ink); border:3px solid var(--ink); font-family:var(--f-display); font-weight:900; font-size:clamp(24px,4vw,40px); line-height:1; padding:14px 26px; border-radius:14px; text-align:center; max-width:90%;
  box-shadow:0 0 0 5px var(--edge), 0 18px 40px rgba(0,0,0,.6); animation:pop .4s cubic-bezier(.2,1.5,.4,1); pointer-events:none}
.banner small{display:block; font-family:var(--f-hand); font-weight:400; font-size:18px; line-height:1.2; color:var(--ink-soft); margin-top:6px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4) rotate(-12deg)}}
.toasts{position:absolute; top:calc(var(--gt) + 64px); left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(470px, calc(100vw - 32px))}
.toast{padding:8px 14px; font-weight:700; font-size:14px; border-radius:12px; background:linear-gradient(180deg, rgba(43,31,23,.97), rgba(26,18,14,.97)); border:2px solid var(--gold-2); box-shadow:0 8px 20px rgba(0,0,0,.6); animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.toast.bad{border-color:var(--red)}
@keyframes tin{from{transform:translateY(-16px) scale(.92); opacity:0}}

/* ---------- fenêtres (parchemin) ---------- */
.backdrop{position:absolute; inset:0; z-index:50; background:rgba(8,5,4,.62); display:flex; align-items:center; justify-content:center; animation:fade .2s; padding:var(--gt) var(--gr) var(--gb) var(--gl)}
@keyframes fade{from{opacity:0}}
.modal{position:relative; width:100%; max-width:600px; max-height:calc(100% - 20px); overflow:auto; padding:20px; color:var(--ink); background:var(--parch); border:3px solid var(--ink); border-radius:18px;
  background-image:radial-gradient(circle at 15% 10%, rgba(255,255,255,.4), transparent 40%), radial-gradient(circle at 90% 95%, rgba(150,100,40,.16), transparent 45%);
  box-shadow:0 0 0 4px var(--gold-2), 0 0 0 7px #2a1a0e, 0 30px 70px rgba(0,0,0,.7); animation:mpop .35s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{max-width:800px}
@keyframes mpop{from{transform:scale(.88) rotate(-2deg); opacity:0}}
.modal h2{font-family:var(--f-display); font-weight:900; font-size:32px; line-height:1; margin:0 0 6px; color:var(--red-2); text-wrap:balance}
.modal h3{font-family:var(--f-display); font-weight:800; font-size:20px; margin:14px 0 6px; color:var(--ink)}
.modal p{margin:6px 0}
.modal .hint{color:var(--ink-soft)}
.modal .no{color:var(--red-2)}
.modal .x{position:absolute; top:12px; right:12px; border:2px solid var(--ink); background:var(--parch-2); border-radius:10px; width:34px; height:34px; font-size:15px; color:var(--ink)}
.mfoot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px}
.cardhead{display:flex; gap:14px; align-items:center; padding-right:30px}
.portrait{width:96px; height:96px; flex:none; border-radius:18px; background:radial-gradient(circle at 50% 40%, #5a4636, #1e1510); border:3px solid var(--gold-2); display:flex; align-items:center; justify-content:center; padding:6px; box-shadow:0 0 0 3px #2a1a0e, 0 6px 14px rgba(0,0,0,.4)}
.portrait.no img{filter:brightness(0) opacity(.35)}
.bubble{position:relative; background:var(--edge); border:2px solid var(--ink); border-radius:16px; padding:8px 13px; margin:14px 0 4px; font-family:var(--f-hand); font-size:18px; line-height:1.25}
.bubble::before{content:""; position:absolute; top:-12px; left:34px; border:10px solid transparent; border-top:0; border-bottom-color:var(--ink)}
.bubble::after{content:""; position:absolute; top:-8px; left:36px; border:8px solid transparent; border-top:0; border-bottom-color:var(--edge)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin-top:8px}
.kv dt{font-weight:700; color:var(--ink-soft)} .kv dd{margin:0}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
.sbtn{border:2px solid var(--ink); border-radius:11px; padding:7px 12px; font-weight:700; font-size:13.5px; background:var(--parch-2); color:var(--ink); box-shadow:0 2px 0 var(--ink); display:inline-flex; align-items:center; gap:5px}
.sbtn:hover{background:var(--parch-3)}
.sbtn.pri{background:var(--gold)} .sbtn.pri:hover{background:#f2c066}
.sbtn.danger{background:#f0bfb2} .sbtn.danger:hover{background:#e8a593}
.sbtn:disabled{opacity:.45; cursor:not-allowed}
select.sel{font:inherit; font-size:13.5px; border-radius:10px; border:2px solid var(--ink); padding:6px 8px; background:var(--edge); color:var(--ink); max-width:100%}
.tag2{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--parch-2); border:1.5px solid var(--parch-3); color:var(--ink-soft); margin:2px 3px 0 0}
.tip .tag2{background:rgba(255,240,210,.08); border-color:var(--bronze-2); color:var(--cream-2)}
.hearts{font-size:11px; letter-spacing:-1px; white-space:nowrap} .hearts .off{opacity:.3}
.flist{display:flex; flex-direction:column; gap:6px}
.frow{display:flex; gap:10px; align-items:center; background:var(--edge); border:2px solid var(--parch-3); border-radius:12px; padding:5px 8px}
.frow img.th{width:46px; height:46px; flex:none}
.frow > span:nth-child(2){flex:1; min-width:0}
.clockrow{display:flex; gap:14px; align-items:center; margin:10px 0}
.clockrow svg{flex:none}
.choices{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px}
.choice{border:2px solid var(--ink); background:var(--edge); color:var(--ink); border-radius:14px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:3px; min-width:0; box-shadow:0 3px 0 var(--ink)}
.choice[aria-pressed="true"]{background:#fff0c0; box-shadow:0 0 0 3px var(--gold), 0 3px 0 var(--ink)}
.choice:disabled{opacity:.45; cursor:not-allowed}
.choice .emo{font-size:28px}
.choice img.th{width:42px; height:46px}
.choice b{font-family:var(--f-display); font-size:18px; line-height:1.05}
.choice span{font-size:12.5px; color:var(--ink-soft)}
.field{display:flex; flex-direction:column; gap:4px; margin:10px 0}
.field label{font-weight:700; font-size:13px}
.field input{font:inherit; border:2px solid var(--ink); border-radius:12px; padding:8px 12px; background:var(--edge); color:var(--ink)}
.team{display:flex; gap:6px; margin:6px 0} .team img.th{width:48px; height:52px}
.dice{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0}
.die{width:56px; height:56px; border-radius:14px; background:var(--edge); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:900; font-size:32px; color:var(--ink)}
.die.roll{animation:shake .12s infinite} .die.best{background:var(--gold)} .die.six{background:#a9d68f}
