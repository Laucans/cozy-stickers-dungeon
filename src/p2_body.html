
<div id="game">
  <canvas id="cv" aria-label="Le château, vu en isométrique"></canvas><div id="cvvig" aria-hidden="true"></div>

  <!-- barre du haut, fine, façon Civilization : ressources à gauche, nuit et menus à droite -->
  <header class="topbar" id="hudTop">
    <button class="tbtn" id="btnMenu" type="button" title="Partie" aria-label="Partie">☰</button>
    <div class="tcastle"><b id="dname">Le Château de Minuit</b><small id="dtitle"></small></div>
    <div class="tres" id="res"></div>
    <div class="tclocks" id="clocks"></div>
    <button class="tturn" id="turn" type="button" title="Nuit et palier"></button>
    <div class="tsys">
      <button class="tbtn" id="btnAdmin" type="button" title="Atelier du Maître" aria-label="Ouvrir l'Atelier du Maître" hidden>🛠️</button>
      <button class="tbtn" id="btnSound" type="button" title="Son" aria-label="Activer ou couper le son">🔈</button>
      <button class="tbtn" id="btnHelp" type="button" title="Le Grimoire" aria-label="Le Grimoire">📖</button>
    </div>
  </header>
  <div class="phases" id="phases"></div>

  <!-- à gauche, replié : les créatures et leurs fiches -->
  <aside class="hud-left" id="hudLeft">
    <button class="chip" id="btnCrit" type="button" aria-expanded="false" title="Tes créatures">🐾 <span id="critCount"></span></button>
    <div class="leftpanel" id="leftPanel" hidden>
      <div class="minis"><button class="mini" id="btnBest" type="button" title="Bestiaire et album" aria-label="Bestiaire">📒</button><button class="mini" id="btnRen" type="button" title="Réputation : ce que pensent de toi les espèces" aria-label="Réputation">⭐</button><button class="mini" id="btnAch" type="button" title="Le Livre du Maître : tes moments marquants, chapitre par chapitre" aria-label="Le Livre du Maître">📖</button><button class="mini" id="btnQuests" type="button" title="Envies du château et missions des créatures" aria-label="Envies et missions">📜</button></div>
      <div class="portraits" id="portraits"></div>
    </div>
  </aside>

  <!-- à droite : ce qui demande ton attention, comme les notifications de Civilization -->
  <aside class="notifs" id="notifs" aria-live="polite"></aside>

  <!-- tiroir de construction, ouvert par le bouton Construire -->
  <div class="hud-bottom" id="hudBottom" hidden>
    <div class="raidnote panel" id="raidnote" hidden></div>
    <div class="buildbar panel">
      <div class="barhead"><div class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="room" aria-selected="true">Pièces</button>
        <button type="button" role="tab" data-tab="def" aria-selected="false">Pièges</button>
        <button type="button" role="tab" data-tab="decor" aria-selected="false">Déco</button>
        <button type="button" role="tab" data-tab="arte" aria-selected="false">Trésors</button>
      </div><button class="pill shut" id="btnBuildClose" type="button" aria-label="Fermer la construction">✕</button></div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>
  <div class="handbar panel" id="handbar" hidden></div>
  <div class="hud-build" id="hudBuild">
    <button class="round build" id="btnBuild" type="button" aria-expanded="false"><img data-ico="build" alt=""><span>Construire</span></button>
    <div class="floors" id="floors" hidden></div>
  </div>

  <!-- en bas à droite : la mini-carte, quelques actions, et la fin de la nuit -->
  <div class="hud-actions" id="hudActions">
    <button class="minimap" id="minimap" type="button" title="Carte du Val" aria-label="Ouvrir la carte du Val"><canvas id="mmcv"></canvas><span>Carte du Val</span></button>
    <div class="actrow">
      <div class="acts">
        <button class="act" id="zfit" type="button" title="Recadrer le château" aria-label="Recadrer le château">⤢</button>
        <button class="act" id="btnPath" type="button" aria-pressed="false" title="Chemin des héros" aria-label="Chemin des héros"><img data-ico="path" alt=""></button>
        <button class="act" id="btnGuards" type="button" aria-pressed="false" title="Défense du château" aria-label="Défense du château" hidden><img data-ico="shield" alt=""></button>
        <button class="act" id="btnRaid" type="button" title="Raids et expéditions" aria-label="Raids et expéditions"><img data-ico="raid" alt=""></button>
        <button class="act" id="btnTier" type="button" title="Cœur du donjon : palier, étages et remparts" aria-label="Cœur du donjon et palier"><img data-ico="tier" alt=""></button>
        <button class="act" id="btnVal" type="button" title="Le Val des Maîtres" aria-label="Le Val des Maîtres"><img data-ico="val" alt=""></button>
      </div>
      <button class="round night" id="btnNight" type="button"><img data-ico="night" alt=""><span>Finir la nuit</span></button>
    </div>
  </div>

  <div class="coopbar panel" id="coopbar" hidden></div>
  <div class="visitbar panel" id="visitbar" hidden></div>
  <div class="tip" id="tip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="advisor" id="advisor" hidden></div>
  <div class="admin" id="admin" hidden></div>
  <button class="admin-fab" id="adminFab" type="button" hidden>🛠️ Rouvrir l'Atelier du Maître</button>
  <div id="modalRoot"></div>
</div>
