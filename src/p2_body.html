
<div id="game">
  <canvas id="cv" aria-label="Le château, vu en isométrique"></canvas>

  <header class="hud-top" id="hudTop">
    <div class="brand" aria-label="Cozy Stickers Dungeon"><span class="small">Cozy Stickers</span><span class="big">Dungeon</span></div>
    <div class="castle panel"><b id="dname">Le Château de Minuit</b><small id="dtitle"></small></div>
    <div class="resbar panel" id="res"></div>
    <div class="dials" id="clocks"></div>
    <div class="sysbtns">
      <button class="rbtn" id="btnAdmin" type="button" title="Atelier du Maître" aria-label="Ouvrir l'Atelier du Maître" hidden>🛠️</button>
      <button class="rbtn" id="btnSound" type="button" title="Son" aria-label="Activer ou couper le son">🔈</button>
      <button class="rbtn" id="btnHelp" type="button" title="Le manuel du Maître" aria-label="Comment jouer">📖</button>
      <button class="rbtn" id="btnMenu" type="button" title="Partie" aria-label="Options de partie">⚙️</button>
    </div>
  </header>
  <div class="phases" id="phases"></div>

  <aside class="hud-left" id="hudLeft">
    <button class="pill best" id="btnBest" type="button" title="Bestiaire et album">Bestiaire <span id="critCount"></span></button>
    <div class="minis"><button class="mini" id="btnRen" type="button" title="Renommée du château auprès de chaque espèce" aria-label="Renommée">⭐</button><button class="mini" id="btnAch" type="button" title="Hauts faits et pouvoirs" aria-label="Hauts faits">🏆</button><button class="mini" id="btnQuests" type="button" title="Envies du château et missions des créatures" aria-label="Missions">📜</button></div>
    <div class="portraits" id="portraits"></div>
  </aside>

  <aside class="tracker panel" id="tracker">
    <button class="trackhead" id="trackHead" type="button">Envies du château <span id="goalCount"></span></button>
    <ul class="goals" id="goals"></ul>
    <div class="qhead">Missions des créatures <span id="questCount"></span></div>
    <ul class="goals quests" id="quests"></ul>
    <button class="link" id="btnLog" type="button">Lire la chronique</button>
  </aside>

  <div class="zoom">
    <button id="zin" type="button" aria-label="Zoomer">+</button>
    <button id="zout" type="button" aria-label="Dézoomer">−</button>
    <button id="zfit" type="button" aria-label="Voir tout le château" title="Voir tout le château">⤢</button>
  </div>

  <div class="hud-bottom" id="hudBottom">
    <div class="handbar panel" id="handbar" hidden></div>
    <div class="raidnote panel" id="raidnote" hidden></div>
    <div class="buildbar panel">
      <div class="barhead"><div class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="room" aria-selected="true">Pièces</button>
        <button type="button" role="tab" data-tab="furn" aria-selected="false">Meubles</button>
        <button type="button" role="tab" data-tab="def" aria-selected="false">Pièges</button>
        <button type="button" role="tab" data-tab="decor" aria-selected="false">Déco</button>
        <button type="button" role="tab" data-tab="arte" aria-selected="false">Trésors</button>
      </div><div class="floors" id="floors" hidden></div></div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <div class="hud-actions">
    <button class="round" id="btnPath" type="button" aria-pressed="false"><img data-ico="path" alt=""><span>Chemin</span></button>
    <button class="round" id="btnRaid" type="button"><img data-ico="raid" alt=""><span>Raid</span></button>
    <button class="round" id="btnTier" type="button"><img data-ico="tier" alt=""><span>Palier</span></button>
    <button class="round" id="btnMap" type="button"><img data-ico="map" alt=""><span>Carte</span></button>
    <button class="round" id="btnVal" type="button"><img data-ico="val" alt=""><span>Le Val</span></button>
    <button class="round night" id="btnNight" type="button"><img data-ico="night" alt=""><span>Finir la nuit</span></button>
  </div>

  <div class="coopbar panel" id="coopbar" hidden></div>
  <div class="visitbar panel" id="visitbar" hidden></div>
  <div class="tip" id="tip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="advisor" id="advisor" hidden></div>
  <div class="admin" id="admin" hidden></div>
  <button class="admin-fab" id="adminFab" type="button" hidden>🛠️ Rouvrir l'Atelier du Maître</button>
  <div id="modalRoot"></div>
</div>
